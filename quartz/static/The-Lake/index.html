<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE LAKE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            background: #000;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ASCII background images - Dweller style */
        .ascii-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .ascii-img {
            position: absolute;
            font-family: 'SF Mono', 'Monaco', monospace;
            font-size: 4px;
            line-height: 1;
            white-space: pre;
            color: #fff;
            opacity: 0.14;
        }


        /* Header ASCII image */
        .header-ascii {
            position: relative;
            z-index: 1;
            width: 100%;
        }

        .header-ascii img {
            width: 100%;
            height: auto;
            display: block;
        }
        /* Title */
        .title-section {
            position: relative;
            z-index: 10;
            padding: 30px 30px 40px;
        }

        .title {
            font-family: 'Inter', 'Helvetica Neue', sans-serif;
            font-size: 120px;
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 0.9;
        }


        .subtitle-bar {
            position: relative;
            z-index: 10;
            padding: 8px 30px;
            border-top: 1px dashed #333;
            border-bottom: 1px dashed #333;
            text-align: right;
            font-family: 'SF Mono', 'Monaco', monospace;
            font-size: 12px;
            color: #fff;
        }

        .online {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            font-size: 12px;
            color: #4a9f7e;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #4a9f7e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .users-list {
            margin-left: 12px;
            font-size: 11px;
            color: #555;
        }
        .users-list span {
            display: inline;
            margin-right: 12px;
            color: #4a9f7e;
        }

        /* Name prompt overlay */
        .name-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        .name-overlay.hidden {
            display: none;
        }
        .name-overlay label {
            font-size: 14px;
            color: #888;
        }
        .name-overlay input {
            font-family: 'Inter', sans-serif;
            font-size: 24px;
            font-weight: 900;
            background: transparent;
            border: none;
            border-bottom: 1px solid #333;
            color: #fff;
            text-align: center;
            padding: 10px;
            outline: none;
            width: 300px;
        }
        .name-overlay input::placeholder {
            color: #333;
        }
        .name-overlay button {
            font-family: 'SF Mono', monospace;
            font-size: 12px;
            background: transparent;
            border: 1px solid #333;
            color: #4a9f7e;
            padding: 8px 20px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .name-overlay button:hover {
            border-color: #4a9f7e;
        }

        /* Editor area */
        .editor-wrap {
            position: relative;
            z-index: 10;
            padding: 0 30px 100px;
        }

        .content-area {
            position: relative;
            z-index: 1;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            line-height: 1.8;
            min-height: 60vh;
            cursor: text;
        }

        .content-area .chunk {
            display: inline;
        }

        .content-area .chunk .author-tag {
            color: #555;
            font-size: 9px;
            font-family: 'SF Mono', monospace;
            vertical-align: super;
            margin-left: 1px;
            margin-right: 3px;
        }

        .content-area .chunk .text {
            color: #fff;
        }


        /* Blinking cursor */
        .write-cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: #4a9f7e;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Hidden input for typing */
        .hidden-input {
            position: fixed;
            top: -100px;
            left: -100px;
            opacity: 0;
            pointer-events: none;
        }


    </style>
</head>
<body>

<div class="name-overlay" id="nameOverlay">
    <label>enter your name</label>
    <input type="text" id="nameInput" placeholder="..." autofocus>
    <button onclick="enterLake()">enter</button>
</div>

<div class="header-ascii">
    <img src="header/header_ascii.png" alt="The Lake">
</div>

<div class="subtitle-bar">Retcon Black Mountain</div>

<div class="title-section">
    <div class="title">The Lake</div>
    <div class="online"><span class="dot"></span><span id="users">0</span> online<span class="users-list" id="usersList"></span></div>
</div>

<div class="editor-wrap">
    <div class="ascii-bg" id="asciiBg"></div>
    <div class="content-area" id="contentArea"></div>
</div>

<input class="hidden-input" id="hiddenInput" autofocus>


<script>
// ===========================================
// ASCII BACKGROUND - Dweller style
// Convert images from Images/ folder to ASCII
// Randomly positioned, different each connection
// ===========================================

const ASCII_CHARS = ['█', '▓', '▒', '░', '●', '○', '▄', '▂', '·', '„', ',', ' '];
const IMAGE_FILES = []; // Will be populated from images.json

async function loadAsciiBackgrounds() {
    try {
        const res = await fetch('images.json');
        const imageList = await res.json();
        if (!imageList.length) return;

        // Pick 3-5 random images
        const count = Math.min(imageList.length, 3 + Math.floor(Math.random() * 3));
        const shuffled = imageList.sort(() => Math.random() - 0.5).slice(0, count);

        const container = document.getElementById('asciiBg');

        const startY = 50; // start near top of editor area

        // Load all images, then place them sequentially to avoid overlap
        const loaded = [];
        let loadCount = 0;

        for (let i = 0; i < shuffled.length; i++) {
            const imgFile = shuffled[i];
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.src = 'Images/' + imgFile;
            img.onload = ((index) => () => {
                // More size variation: 140 to 320 cols
                const sizes = [140, 160, 180, 220, 260, 300, 320];
                const cols = sizes[Math.floor(Math.random() * sizes.length)];
                const ascii = imageToAscii(img, cols);
                loaded[index] = { ascii, cols };
                loadCount++;

                // Once all loaded, place them without overlap
                if (loadCount === shuffled.length) {
                    let currentY = startY;
                    for (let j = 0; j < loaded.length; j++) {
                        if (!loaded[j]) continue;
                        const el = document.createElement('div');
                        el.className = 'ascii-img';
                        el.textContent = loaded[j].ascii;
                        el.style.top = currentY + 'px';
                        el.style.left = (j % 2 === 0) ? '5%' : '35%';
                        container.appendChild(el);

                        // Measure actual height and add gap
                        const h = el.offsetHeight || 200;
                        currentY += h + 150; // 150px gap between images
                    }
                    container.style.height = currentY + 'px';
                }
            })(i);
        }
    } catch (e) {
        // No images.json, skip backgrounds
    }
}

function imageToAscii(img, cols) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    const aspectRatio = img.height / img.width;
    const rows = Math.floor(cols * aspectRatio * 0.5);

    canvas.width = cols;
    canvas.height = rows;
    ctx.drawImage(img, 0, 0, cols, rows);

    const imageData = ctx.getImageData(0, 0, cols, rows);
    const pixels = imageData.data;

    let ascii = '';
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            const idx = (y * cols + x) * 4;
            const r = pixels[idx];
            const g = pixels[idx + 1];
            const b = pixels[idx + 2];

            let gray = 0.299 * r + 0.587 * g + 0.114 * b;
            // Boost contrast like Dweller
            gray = ((gray / 255 - 0.5) * 2.2 + 0.5) * 255;
            gray = Math.max(0, Math.min(255, gray));

            // Posterize to fewer levels
            const levels = 8;
            const step = 255 / levels;
            gray = Math.floor(gray / step) * step;

            const charIndex = Math.min(
                ASCII_CHARS.length - 1,
                Math.floor((gray / 255) * ASCII_CHARS.length)
            );
            ascii += ASCII_CHARS[charIndex];
        }
        ascii += '\n';
    }
    return ascii;
}

loadAsciiBackgrounds();

// ===========================================
// FIREBASE
// ===========================================

const firebaseConfig = {
    apiKey: "AIzaSyBkUvAiNwfM1ZVVDOpNWKrhDyeehs_I9jg",
    authDomain: "the-lake-b8eb9.firebaseapp.com",
    databaseURL: "https://the-lake-b8eb9-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "the-lake-b8eb9",
    storageBucket: "the-lake-b8eb9.firebasestorage.app",
    messagingSenderId: "170372794731",
    appId: "1:170372794731:web:2674110cc4cbbe7500a42e"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const chunksRef = db.ref('firepad/chunks');
const usersRef = db.ref('firepad/users');

const myId = 'user_' + Math.random().toString(36).substr(2, 9);
let myName = '';

const contentArea = document.getElementById('contentArea');
const hiddenInput = document.getElementById('hiddenInput');
const usersEl = document.getElementById('users');
const usersList = document.getElementById('usersList');
const nameInput = document.getElementById('nameInput');

let chunks = [];
let isRemote = false;

nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') enterLake();
});

function enterLake() {
    myName = nameInput.value.trim() || 'anonymous';
    document.getElementById('nameOverlay').classList.add('hidden');
    startPad();
}

// Cursor position: { chunkIndex, charOffset } or null (end)
// chunkIndex: which chunk the cursor is in/after
// charOffset: character position within that chunk's text
let cursorAt = null; // null = end of document

function focusInput() {
    hiddenInput.focus();
}

function renderContent() {
    let html = '';

    for (let i = 0; i < chunks.length; i++) {
        const c = chunks[i];
        const text = c.text;

        // Check if cursor is inside this chunk
        if (cursorAt && cursorAt.chunkIndex === i) {
            const before = escapeHtml(text.slice(0, cursorAt.charOffset));
            const after = escapeHtml(text.slice(cursorAt.charOffset));
            html += `<span class="chunk" data-index="${i}">`;
            html += `<span class="text"><span class="text-part" data-index="${i}" data-offset="before">${before}</span>`;
            html += '<span class="write-cursor"></span>';
            html += `<span class="text-part" data-index="${i}" data-offset="after">${after}</span></span>`;
            html += `<span class="author-tag">${c.author}</span></span>`;
        } else {
            const escaped = escapeHtml(c.text);
            html += `<span class="chunk" data-index="${i}"><span class="text">${escaped}</span><span class="author-tag">${c.author}</span></span>`;
        }
    }

    // Cursor at end of document
    if (!cursorAt) {
        html += '<span class="write-cursor"></span>';
    }

    contentArea.innerHTML = html;
}

// Place cursor by clicking — snap to valid insertion points only
// Valid positions: end of chunk, start of chunk, after a space, after a newline
contentArea.addEventListener('click', (e) => {
    const sel = window.getSelection();
    if (sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        const node = range.startContainer;
        const offset = range.startOffset;

        const chunkEl = node.nodeType === 3
            ? node.parentElement.closest('.chunk')
            : node.closest('.chunk');

        if (chunkEl) {
            const idx = parseInt(chunkEl.dataset.index);
            const rawOffset = getCharOffset(chunkEl, node, offset, idx);
            const text = chunks[idx].text;

            // Snap to nearest valid position:
            // - start (0)
            // - end (text.length)
            // - after a space or newline
            const validPositions = [0, text.length];
            for (let p = 0; p < text.length; p++) {
                if (text[p] === ' ' || text[p] === '\n') {
                    validPositions.push(p + 1); // after the space/newline
                    validPositions.push(p);     // before the space/newline
                }
            }

            // Find closest valid position
            let best = 0;
            let bestDist = Infinity;
            for (const pos of validPositions) {
                const dist = Math.abs(pos - rawOffset);
                if (dist < bestDist) {
                    bestDist = dist;
                    best = pos;
                }
            }

            cursorAt = { chunkIndex: idx, charOffset: best };
        } else {
            cursorAt = null;
        }
    } else {
        cursorAt = null;
    }

    renderContent();
    focusInput();
});

function getCharOffset(chunkEl, node, offset, chunkIdx) {
    // Get the .text span inside this chunk
    const textEl = chunkEl.querySelector('.text');
    if (!textEl) return chunks[chunkIdx].text.length;

    // Walk through text nodes to find position
    const walker = document.createTreeWalker(textEl, NodeFilter.SHOW_TEXT);
    let pos = 0;
    let current;
    while (current = walker.nextNode()) {
        if (current === node) {
            return pos + offset;
        }
        pos += current.textContent.length;
    }
    return chunks[chunkIdx].text.length;
}

function getInsertOrder(insertPos) {
    if (chunks.length === 0) return 0;
    if (insertPos >= chunks.length) {
        return chunks[chunks.length - 1].order + 1;
    } else if (insertPos === 0) {
        return chunks[0].order - 1;
    } else {
        const prev = chunks[insertPos - 1].order;
        const next = chunks[insertPos].order;
        return prev + (next - prev) / 2;
    }
}

function startPad() {
    chunksRef.orderByChild('order').on('value', (snapshot) => {
        isRemote = true;
        const data = snapshot.val();
        if (data) {
            chunks = Object.entries(data).map(([key, val]) => ({
                key,
                author: val.author,
                text: val.text,
                order: val.order
            })).sort((a, b) => a.order - b.order);
        } else {
            chunks = [];
        }
        renderContent();
        isRemote = false;
    });

    function insertText(typed) {
        if (!cursorAt) {
            // Cursor at end — append or extend last chunk
            const last = chunks[chunks.length - 1];
            if (last && last.author === myName) {
                last.text += typed;
                chunksRef.child(last.key).update({ text: last.text });
            } else {
                const order = chunks.length ? chunks[chunks.length - 1].order + 1 : 0;
                chunksRef.push({ author: myName, text: typed, order });
            }
        } else {
            const { chunkIndex, charOffset } = cursorAt;
            const chunk = chunks[chunkIndex];

            if (chunk.author === myName) {
                // Our own chunk — insert text at offset
                chunk.text = chunk.text.slice(0, charOffset) + typed + chunk.text.slice(charOffset);
                chunksRef.child(chunk.key).update({ text: chunk.text });
                cursorAt.charOffset += typed.length;
            } else if (charOffset >= chunk.text.length) {
                // At end of someone else's chunk
                if (typed === '\n') {
                    // Newline: append to their chunk so signature stays attached
                    chunk.text += typed;
                    chunksRef.child(chunk.key).update({ text: chunk.text });
                    cursorAt.charOffset = chunk.text.length;
                } else {
                    // Regular text: insert as new chunk after
                    const order = getInsertOrder(chunkIndex + 1);
                    chunksRef.push({ author: myName, text: typed, order });
                    cursorAt = null;
                }
            } else if (charOffset === 0) {
                // At start of someone else's chunk
                if (typed === '\n') {
                    // Newline before chunk: add to previous chunk if exists
                    const prev = chunkIndex > 0 ? chunks[chunkIndex - 1] : null;
                    if (prev) {
                        prev.text += typed;
                        chunksRef.child(prev.key).update({ text: prev.text });
                    } else {
                        const order = getInsertOrder(0);
                        chunksRef.push({ author: myName, text: typed, order });
                    }
                    cursorAt = { chunkIndex, charOffset: 0 };
                } else {
                    const order = getInsertOrder(chunkIndex);
                    chunksRef.push({ author: myName, text: typed, order });
                    cursorAt = null;
                }
            } else {
                // Middle of someone else's chunk (at a word boundary)
                const textBefore = chunk.text.slice(0, charOffset);
                const textAfter = chunk.text.slice(charOffset);

                if (typed === '\n') {
                    // Newline: just insert it into their chunk (no split needed)
                    chunk.text = textBefore + typed + textAfter;
                    chunksRef.child(chunk.key).update({ text: chunk.text });
                    cursorAt.charOffset = charOffset + 1;
                } else {
                    // Split and insert our text
                    chunksRef.child(chunk.key).update({ text: textBefore });

                    const orderMid = chunk.order + 0.3333;
                    chunksRef.push({ author: myName, text: typed, order: orderMid });

                    const orderAfter = chunk.order + 0.6666;
                    chunksRef.push({ author: chunk.author, text: textAfter, order: orderAfter });

                    cursorAt = null;
                }
            }
        }
    }

    hiddenInput.addEventListener('input', (e) => {
        if (isRemote) return;
        const typed = hiddenInput.value;
        hiddenInput.value = '';
        if (!typed) return;
        insertText(typed);
    });

    hiddenInput.addEventListener('keydown', (e) => {
        if (isRemote) return;

        if (e.key === 'Backspace' || e.key === 'Delete') {
            e.preventDefault();
            return;
        }

        if (e.key === 'Enter') {
            e.preventDefault();
            insertText('\n');
        }
    });

    const myPresence = usersRef.child(myId);
    myPresence.set(myName);
    myPresence.onDisconnect().remove();

    usersRef.on('value', (snapshot) => {
        const users = snapshot.val();
        if (users) {
            const names = Object.values(users);
            usersEl.textContent = names.length;
            usersList.innerHTML = names.map(n => `<span>${n}</span>`).join('');
        } else {
            usersEl.textContent = '0';
            usersList.innerHTML = '';
        }
    });

    focusInput();
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML.replace(/\n/g, '<br>');
}
</script>
