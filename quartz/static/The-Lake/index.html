    <style>

        /* Hidden input for typing */

    </style>
</head>

<input class="hidden-input" id="hiddenInput" autofocus>


<script>
// ===========================================
// ASCII BACKGROUND - Dweller style
// Convert images from Images/ folder to ASCII
// Randomly positioned, different each connection
// ===========================================

const ASCII_CHARS = ['█', '▓', '▄', '●', '○', '▂', '„', ',', ' ', ' ', ' ', ' '];
const IMAGE_FILES = []; // Will be populated from images.json

async function loadAsciiBackgrounds() {
    try {
        const res = await fetch('images.json');
        const imageList = await res.json();
        if (!imageList.length) return;

        // Pick 3-5 random images
        const count = Math.min(imageList.length, 3 + Math.floor(Math.random() * 3));
        const shuffled = imageList.sort(() => Math.random() - 0.5).slice(0, count);

        const container = document.getElementById('asciiBg');

        const startY = 50; // start near top of editor area

        // Load all images, then place them sequentially to avoid overlap
        const loaded = [];
        let loadCount = 0;

        for (let i = 0; i < shuffled.length; i++) {
            const imgFile = shuffled[i];
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.src = 'Images/' + imgFile;
            img.onload = ((index) => () => {
                // More size variation: 140 to 320 cols
                const sizes = [80, 100, 120, 140];
                const cols = sizes[Math.floor(Math.random() * sizes.length)];
                const ascii = imageToAscii(img, cols);
                loaded[index] = { ascii, cols };
                loadCount++;

                // Once all loaded, place them without overlap
                if (loadCount === shuffled.length) {
                    let currentY = startY;
                    for (let j = 0; j < loaded.length; j++) {
                        if (!loaded[j]) continue;
                        const el = document.createElement('div');
                        el.className = 'ascii-img';
                        el.textContent = loaded[j].ascii;
                        el.style.top = currentY + 'px';
                        el.style.left = (j % 2 === 0) ? '5%' : '35%';
                        container.appendChild(el);

                        // Measure actual height and add gap
                        const h = el.offsetHeight || 200;
                        currentY += h + 150; // 150px gap between images
                    }
                    container.style.height = currentY + 'px';
                }
            })(i);
        }
    } catch (e) {
        // No images.json, skip backgrounds
    }
}

function imageToAscii(img, cols) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    const aspectRatio = img.height / img.width;
    const rows = Math.floor(cols * aspectRatio * 0.5);

    canvas.width = cols;
    canvas.height = rows;
    ctx.drawImage(img, 0, 0, cols, rows);

    const imageData = ctx.getImageData(0, 0, cols, rows);
    const pixels = imageData.data;

    // Calculate average brightness to decide if we invert
    let totalBright = 0;
    const totalPixels = cols * rows;
    for (let i = 0; i < totalPixels; i++) {
        const idx = i * 4;
        totalBright += 0.299 * pixels[idx] + 0.587 * pixels[idx + 1] + 0.114 * pixels[idx + 2];
    }
    const avgBright = totalBright / totalPixels;
    // If image is mostly bright (>50%), invert so we get fewer visible chars on black
    const invert = avgBright > 127;

    let ascii = '';
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            const idx = (y * cols + x) * 4;
            const r = pixels[idx];
            const g = pixels[idx + 1];
            const b = pixels[idx + 2];

            let gray = 0.299 * r + 0.587 * g + 0.114 * b;
            if (invert) gray = 255 - gray;

            // Contrast
            gray = ((gray / 255 - 0.5) * 2.5 + 0.5) * 255;
            gray = Math.max(0, Math.min(255, gray));

            // Posterize
            const levels = 6;
            const step = 255 / levels;
            gray = Math.floor(gray / step) * step;

            const charIndex = Math.min(
                ASCII_CHARS.length - 1,
                Math.floor((gray / 255) * ASCII_CHARS.length)
            );
            ascii += ASCII_CHARS[charIndex];
        }
        ascii += '\n';
    }
    return ascii;
}

loadAsciiBackgrounds();

// ===========================================
// FIREBASE
// ===========================================

const firebaseConfig = {
    apiKey: "AIzaSyBkUvAiNwfM1ZVVDOpNWKrhDyeehs_I9jg",
    authDomain: "the-lake-b8eb9.firebaseapp.com",
    databaseURL: "https://the-lake-b8eb9-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "the-lake-b8eb9",
    storageBucket: "the-lake-b8eb9.firebasestorage.app",
    messagingSenderId: "170372794731",
    appId: "1:170372794731:web:2674110cc4cbbe7500a42e"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const chunksRef = db.ref('firepad/chunks');
const usersRef = db.ref('firepad/users');

const myId = 'user_' + Math.random().toString(36).substr(2, 9);
let myName = '';

function isMyChunk(chunk) {
    // A chunk is mine only if I have a non-empty name AND it matches
    // Also store myId in chunks for reliable ownership
    return chunk.authorId === myId;
}

const contentArea = document.getElementById('contentArea');
const hiddenInput = document.getElementById('hiddenInput');
const usersEl = document.getElementById('users');
const usersList = document.getElementById('usersList');
const nameInput = document.getElementById('nameInput');

let chunks = [];
let isRemote = false;

// Update name dynamically when user types
nameInput.addEventListener('input', () => {
    const newName = nameInput.value.trim() || 'anonymous';
    if (newName !== myName) {
        myName = newName;
        // Update presence
        const myPresence = usersRef.child(myId);
        myPresence.set(myName);
    }
});

// Prevent Enter in name field from creating newlines
nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        hiddenInput.focus();
    }
});

// Cursor position: { chunkKey, charOffset } or null (end)
// chunkKey: Firebase key of the chunk
// charOffset: character position within that chunk's text
let cursorAt = null; // null = end of document
let activeChunkKey = null; // track chunk being typed into

function focusInput() {
    hiddenInput.focus();
}

function getAuthorStyle(author) {
    return "font-family:'Archivo Narrow', sans-serif;font-size:40px;font-weight:700;";
}

function renderChunkHtml(text, author) {
    // Signature goes after the last non-newline character
    const match = text.match(/^([\s\S]*?\S)([\s\n]*)$/);
    if (match) {
        const content = escapeHtml(match[1]);
        const trailing = escapeHtml(match[2]);
        return `<span class="text">${content}</span><span class="author-tag">${author}</span>${trailing ? `<span class="text">${trailing}</span>` : ''}`;
    }
    const escaped = escapeHtml(text);
    return `<span class="text">${escaped}</span><span class="author-tag">${author}</span>`;
}

function renderContent() {
    let html = '';
    // Resolve cursorAt chunkKey to current index
    let cursorIdx = -1;
    if (cursorAt) {
        cursorIdx = chunks.findIndex(c => c.key === cursorAt.chunkKey);
        if (cursorIdx === -1) cursorAt = null; // chunk was deleted
    }

    for (let i = 0; i < chunks.length; i++) {
        const c = chunks[i];

        const style = getAuthorStyle(c.author);
        if (cursorAt && i === cursorIdx) {
            const offset = Math.min(cursorAt.charOffset, c.text.length);
            const before = c.text.slice(0, offset);
            const after = c.text.slice(offset);
            html += `<span class="chunk" data-index="${i}" style="${style}">`;
            html += `<span class="text">${escapeHtml(before)}</span>`;
            html += '<span class="write-cursor"></span>';
            if (after) {
                // Find where signature should go (after last non-whitespace)
                const lastNonWs = after.search(/\s*$/);
                if (lastNonWs > 0) {
                    html += `<span class="text">${escapeHtml(after.slice(0, lastNonWs))}</span><span class="author-tag">${c.author}</span><span class="text">${escapeHtml(after.slice(lastNonWs))}</span>`;
                } else {
                    html += `<span class="text">${escapeHtml(after)}</span><span class="author-tag">${c.author}</span>`;
                }
            } else {
                html += `<span class="author-tag">${c.author}</span>`;
            }
            html += `</span>`;
        } else {
            html += `<span class="chunk" data-index="${i}" style="${style}">${renderChunkHtml(c.text, c.author)}</span>`;
        }
    }

    // Cursor at end or after active chunk
    if (!cursorAt) {
        if (activeChunkKey) {
            const activeIdx = chunks.findIndex(c => c.key === activeChunkKey);
            if (activeIdx >= 0 && activeIdx < chunks.length - 1) {
                html = '';
                for (let i = 0; i < chunks.length; i++) {
                    const c = chunks[i];
                    const s = getAuthorStyle(c.author);
                    html += `<span class="chunk" data-index="${i}" style="${s}">${renderChunkHtml(c.text, c.author)}</span>`;
                    if (i === activeIdx) {
                        html += '<span class="write-cursor"></span>';
                    }
                }
            } else {
                html += '<span class="write-cursor"></span>';
            }
        } else {
            html += '<span class="write-cursor"></span>';
        }
    }

    contentArea.innerHTML = html;
}

// Place cursor by clicking
// Own chunks: anywhere. Other's chunks: only at start, end, or on empty lines (\n\n)
contentArea.addEventListener('click', (e) => {
    const sel = window.getSelection();
    if (sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        const node = range.startContainer;
        const offset = range.startOffset;

        const chunkEl = node.nodeType === 3
            ? node.parentElement.closest('.chunk')
            : node.closest('.chunk');

        if (chunkEl) {
            const idx = parseInt(chunkEl.dataset.index);
            const rawOffset = getCharOffset(chunkEl, node, offset, idx);
            const chunk = chunks[idx];
            const text = chunk.text;

            if (isMyChunk(chunk)) {
                // Own chunk: place cursor anywhere, set as active for editing
                cursorAt = { chunkKey: chunk.key, charOffset: rawOffset };
                activeChunkKey = chunk.key;
            } else {
                // Other's chunk: can write after signature (end) or on any empty line
                // An "empty line" = position after a \n where the next char is also \n or end
                const validPositions = [text.length];
                for (let p = 0; p < text.length; p++) {
                    if (text[p] === '\n') {
                        const nextPos = p + 1;
                        // Valid if next char is \n (empty line) or end of text or beginning
                        if (nextPos >= text.length || text[nextPos] === '\n' || p === 0) {
                            validPositions.push(nextPos);
                        }
                    }
                }
                // Also allow position 0 if text starts with \n
                if (text[0] === '\n') {
                    validPositions.push(0);
                }

                // Snap to closest valid position
                let best = text.length;
                let bestDist = Infinity;
                for (const pos of validPositions) {
                    const dist = Math.abs(pos - rawOffset);
                    if (dist < bestDist) {
                        bestDist = dist;
                        best = pos;
                    }
                }

                cursorAt = { chunkKey: chunk.key, charOffset: best };
            }
        } else {
            cursorAt = null;
        }
    } else {
        cursorAt = null;
    }

    activeChunkKey = null;
    renderContent();
    focusInput();
});

function getCharOffset(chunkEl, node, offset, chunkIdx) {
    // Walk through ALL .text spans in this chunk to find position
    const textEls = chunkEl.querySelectorAll('.text');
    if (!textEls.length) return chunks[chunkIdx].text.length;

    let pos = 0;
    for (const textEl of textEls) {
        const walker = document.createTreeWalker(textEl, NodeFilter.SHOW_TEXT);
        let current;
        while (current = walker.nextNode()) {
            if (current === node) {
                return pos + offset;
            }
            pos += current.textContent.length;
        }
        // If node is the span itself (click on empty area)
        if (node === textEl) {
            return pos;
        }
    }
    return chunks[chunkIdx].text.length;
}

function getInsertOrder(insertPos) {
    if (chunks.length === 0) return 0;
    if (insertPos >= chunks.length) {
        return chunks[chunks.length - 1].order + 1;
    } else if (insertPos === 0) {
        return chunks[0].order - 1;
    } else {
        const prev = chunks[insertPos - 1].order;
        const next = chunks[insertPos].order;
        return prev + (next - prev) / 2;
    }
}

function startPad() {
    chunksRef.orderByChild('order').on('value', (snapshot) => {
        isRemote = true;
        const data = snapshot.val();
        if (data) {
            chunks = Object.entries(data).map(([key, val]) => ({
                key,
                author: val.author || '',
                authorId: val.authorId || '',
                text: val.text,
                order: val.order
            })).sort((a, b) => a.order - b.order);
        } else {
            chunks = [];
        }
        renderContent();
        isRemote = false;
    });

    activeChunkKey = null;

    function insertText(typed) {
        if (!cursorAt) {
            // Cursor at end of document or continuing after an insertion
            // If we have an active chunk we just created, append to it
            if (activeChunkKey) {
                const existing = chunks.find(c => c.key === activeChunkKey);
                if (existing && isMyChunk(existing)) {
                    existing.text += typed;
                    chunksRef.child(activeChunkKey).update({ text: existing.text });
                    return;
                }
            }
            const last = chunks[chunks.length - 1];
            if (last && isMyChunk(last)) {
                last.text += typed;
                chunksRef.child(last.key).update({ text: last.text });
                activeChunkKey = last.key;
            } else {
                const order = chunks.length ? chunks[chunks.length - 1].order + 1 : 0;
                const ref = chunksRef.push({ author: myName, authorId: myId, text: typed, order });
                activeChunkKey = ref.key;
            }
            return;
        }

        const chunkIdx = chunks.findIndex(c => c.key === cursorAt.chunkKey);
        if (chunkIdx === -1) { cursorAt = null; return; }
        const chunk = chunks[chunkIdx];
        const charOffset = Math.min(cursorAt.charOffset, chunk.text.length);

        if (isMyChunk(chunk)) {
            // Own chunk: insert freely at any position
            chunk.text = chunk.text.slice(0, charOffset) + typed + chunk.text.slice(charOffset);
            chunksRef.child(chunk.key).update({ text: chunk.text });
            cursorAt.charOffset = charOffset + typed.length;
            activeChunkKey = chunk.key;
        } else {
            // Other's chunk: cursor is after signature or on trailing empty lines
            if (charOffset >= chunk.text.length) {
                // After their chunk entirely
                const order = getInsertOrder(chunkIdx + 1);
                const ref = chunksRef.push({ author: myName, authorId: myId, text: typed, order });
                activeChunkKey = ref.key;
                // Keep cursor at end of new chunk
                cursorAt = { chunkKey: ref.key, charOffset: typed.length };
            } else {
                // On an empty line — split chunk
                const textBefore = chunk.text.slice(0, charOffset);
                const textAfter = chunk.text.slice(charOffset);

                chunksRef.child(chunk.key).update({ text: textBefore });

                const orderMid = chunk.order + 0.3333;
                const ref = chunksRef.push({ author: myName, authorId: myId, text: typed, order: orderMid });
                activeChunkKey = ref.key;

                const orderAfter = chunk.order + 0.6666;
                chunksRef.push({ author: chunk.author, authorId: chunk.authorId, text: textAfter, order: orderAfter });

                cursorAt = { chunkKey: ref.key, charOffset: typed.length };
            }
        }
    }

    hiddenInput.addEventListener('input', (e) => {
        if (isRemote) return;
        const typed = hiddenInput.value;
        hiddenInput.value = '';
        if (!typed) return;
        insertText(typed);
    });

    hiddenInput.addEventListener('keydown', (e) => {
        if (isRemote) return;

        if (e.key === 'Backspace') {
            e.preventDefault();
            if (cursorAt && cursorAt.chunkKey) {
                // Cursor is inside a chunk
                const chunk = chunks.find(c => c.key === cursorAt.chunkKey);
                if (chunk && isMyChunk(chunk) && cursorAt.charOffset > 0) {
                    chunk.text = chunk.text.slice(0, cursorAt.charOffset - 1) + chunk.text.slice(cursorAt.charOffset);
                    if (chunk.text.length === 0) {
                        chunksRef.child(chunk.key).remove();
                        cursorAt = null;
                        activeChunkKey = null;
                    } else {
                        chunksRef.child(chunk.key).update({ text: chunk.text });
                        cursorAt.charOffset--;
                        activeChunkKey = chunk.key;
                    }
                }
            } else if (activeChunkKey) {
                // Cursor at end, appending to active chunk
                const existing = chunks.find(c => c.key === activeChunkKey);
                if (existing && isMyChunk(existing) && existing.text.length > 0) {
                    existing.text = existing.text.slice(0, -1);
                    if (existing.text.length === 0) {
                        chunksRef.child(activeChunkKey).remove();
                        activeChunkKey = null;
                    } else {
                        chunksRef.child(activeChunkKey).update({ text: existing.text });
                    }
                }
            }
            return;
        }

        if (e.key === 'Delete') {
            e.preventDefault();
            return;
        }

        if (e.key === 'Enter') {
            e.preventDefault();
            insertText('\n');
            return;
        }

        // Arrow keys navigation
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
            e.preventDefault();

            // Build full document text with chunk boundaries
            const docParts = [];
            for (const c of chunks) {
                docParts.push({ key: c.key, text: c.text, author: c.author });
            }

            // Find current absolute position in document
            let absPos = 0;
            const fullText = chunks.map(c => c.text).join('');

            if (cursorAt) {
                const idx = chunks.findIndex(c => c.key === cursorAt.chunkKey);
                if (idx >= 0) {
                    for (let i = 0; i < idx; i++) absPos += chunks[i].text.length;
                    absPos += Math.min(cursorAt.charOffset, chunks[idx].text.length);
                }
            } else {
                absPos = fullText.length;
            }

            let newPos = absPos;

            if (e.key === 'ArrowLeft') {
                newPos = Math.max(0, absPos - 1);
            } else if (e.key === 'ArrowRight') {
                newPos = Math.min(fullText.length, absPos + 1);
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                // Find current line and column
                const before = fullText.slice(0, absPos);
                const lastNewline = before.lastIndexOf('\n');
                const col = lastNewline === -1 ? absPos : absPos - lastNewline - 1;

                if (e.key === 'ArrowUp') {
                    if (lastNewline === -1) {
                        newPos = 0; // already on first line
                    } else {
                        const prevText = fullText.slice(0, lastNewline);
                        const prevNewline = prevText.lastIndexOf('\n');
                        const prevLineStart = prevNewline + 1;
                        const prevLineLen = lastNewline - prevLineStart;
                        newPos = prevLineStart + Math.min(col, prevLineLen);
                    }
                } else {
                    const afterCursor = fullText.slice(absPos);
                    const nextNewline = afterCursor.indexOf('\n');
                    if (nextNewline === -1) {
                        newPos = fullText.length; // already on last line
                    } else {
                        const nextLineStart = absPos + nextNewline + 1;
                        const restAfterNext = fullText.slice(nextLineStart);
                        const endOfNextLine = restAfterNext.indexOf('\n');
                        const nextLineLen = endOfNextLine === -1 ? restAfterNext.length : endOfNextLine;
                        newPos = nextLineStart + Math.min(col, nextLineLen);
                    }
                }
            }

            // Convert absolute position back to chunkKey + charOffset
            if (newPos >= fullText.length) {
                cursorAt = null;
                activeChunkKey = null;
            } else {
                let remaining = newPos;
                let found = false;
                for (const c of chunks) {
                    if (remaining <= c.text.length) {
                        // Check if this position is valid for this chunk
                        if (isMyChunk(c)) {
                            cursorAt = { chunkKey: c.key, charOffset: remaining };
                            activeChunkKey = c.key;
                        } else {
                            // For others' chunks: snap to end or empty lines
                            const validPositions = [c.text.length];
                            for (let p = 0; p < c.text.length; p++) {
                                if (c.text[p] === '\n') {
                                    const nextPos = p + 1;
                                    if (nextPos >= c.text.length || c.text[nextPos] === '\n' || p === 0) {
                                        validPositions.push(nextPos);
                                    }
                                }
                            }
                            if (c.text[0] === '\n') validPositions.push(0);

                            let best = c.text.length;
                            let bestDist = Infinity;
                            for (const pos of validPositions) {
                                const dist = Math.abs(pos - remaining);
                                if (dist < bestDist) { bestDist = dist; best = pos; }
                            }
                            cursorAt = { chunkKey: c.key, charOffset: best };
                            activeChunkKey = null;
                        }
                        found = true;
                        break;
                    }
                    remaining -= c.text.length;
                }
                if (!found) { cursorAt = null; activeChunkKey = null; }
            }

            renderContent();
            return;
        }
    });

    const myPresence = usersRef.child(myId);
    myPresence.set(myName);
    myPresence.onDisconnect().remove();

    usersRef.on('value', (snapshot) => {
        const users = snapshot.val();
        if (users) {
            const names = Object.values(users);
            usersEl.textContent = names.length;
            usersList.innerHTML = names.map(n => `<span>${n}</span>`).join('');
        } else {
            usersEl.textContent = '0';
            usersList.innerHTML = '';
        }
    });

    focusInput();
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Start immediately
startPad();
</script>
