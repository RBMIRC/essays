<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE LAKE</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,700;1,700&family=Inter:wght@400;900&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            background: #000;
            color: #fff;
            min-height: 100vh;
            overflow-x: clip;
        }

        /* ASCII background images */
        .ascii-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .ascii-img {
            position: absolute;
            font-family: 'SF Mono', 'Monaco', monospace;
            font-size: 9px;
            line-height: 1.1;
            white-space: pre;
            color: #fff;
            opacity: 0.2;
        }

        /* Header */
        .header-ascii {
            position: relative;
            z-index: 1;
            width: 100%;
        }

        .header-ascii img {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0.6;
        }

        .subtitle-bar {
            position: relative;
            z-index: 10;
            margin-top: 15px;
            padding: 10px 30px;
            border-top: 1px dashed #555;
            border-bottom: 1px dashed #555;
            display: flex;
            justify-content: space-between;
            font-family: 'SF Mono', 'Monaco', monospace;
            font-size: 12px;
            color: #fff;
        }

        .title-section {
            position: relative;
            z-index: 10;
            padding: 20px 30px 40px;
        }

        .title {
            font-family: 'Inter', 'Helvetica Neue', sans-serif;
            font-size: 120px;
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 0.9;
        }

        .info-line {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-top: 15px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .online {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #4a9f7e;
            flex-shrink: 0;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #4a9f7e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .users-list {
            margin-left: 12px;
            font-size: 12px;
            color: #555;
        }
        .users-list span {
            display: inline;
            margin-right: 12px;
            color: #4a9f7e;
        }

        .name-inline {
            flex-shrink: 0;
            margin-left: auto;
        }

        .name-inline input {
            font-family: 'SF Mono', monospace;
            font-size: 12px;
            background: transparent;
            border: none;
            border-bottom: 1px solid #fff;
            color: #fff;
            padding: 4px 0;
            outline: none;
            width: 150px;
            text-align: right;
        }

        .name-inline input::placeholder {
            color: #888;
        }

        /* Canvas area where messages live */
        .canvas {
            position: relative;
            z-index: 10;
            min-height: 80vh;
            margin: 0 30px 100px;
            cursor: text;
        }

        /* Ruled lines (hidden but keep structure) */
        .ruled-lines {
            display: none;
        }

        /* Go to bottom button */
        .goto-bottom {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 40px;
            height: 40px;
            background: #4a9f7e;
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .goto-bottom:hover {
            opacity: 1;
        }

        /* Each message positioned absolutely, snapped to line */
        .message {
            position: absolute;
            font-family: 'Archivo Narrow', sans-serif;
            font-size: 40px;
            font-weight: 700;
            line-height: 48px;
            height: 48px;
            white-space: pre;
            overflow: visible;
            pointer-events: none;
        }

        .message .author-tag {
            color: #555;
            font-size: 9px;
            font-family: 'SF Mono', monospace;
            vertical-align: super;
            margin-left: 2px;
        }

        /* Selection highlight */
        .selection-highlight {
            position: absolute;
            background: rgba(74, 159, 126, 0.3);
            height: 48px;
            pointer-events: none;
            z-index: 99;
        }

        /* Style menu */
        .style-menu {
            position: absolute;
            display: none;
            background: #222;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 4px;
            z-index: 200;
            gap: 4px;
            flex-direction: row;
        }

        .style-menu button {
            font-family: 'SF Mono', monospace;
            font-size: 11px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
        }

        .style-menu button:hover {
            background: #4a9f7e;
            color: #000;
        }

        /* Blinking cursor */
        .cursor-marker {
            position: absolute;
            display: inline-block;
            width: 2px;
            height: 48px;
            background: #4a9f7e;
            animation: blink 1s step-end infinite;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Hidden input for typing */
        .hidden-input {
            position: fixed;
            top: -100px;
            left: -100px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="header-ascii">
    <img src="Header/header_ascii.png" alt="The Lake">
</div>

<div class="subtitle-bar"><span>A project by Sylvain Couzinet-Jacques</span><span>Retcon Black Mountain</span></div>

<div class="title-section">
    <div class="title">The Lake</div>
    <div class="info-line">
        <div class="online"><span class="dot"></span><span id="users">0</span> online<span class="users-list" id="usersList"></span></div>
        <div class="name-inline"><input type="text" id="nameInput" placeholder="Name (optional)"></div>
    </div>
</div>

<div class="canvas" id="canvas">
    <div class="ascii-bg" id="asciiBg"></div>
    <div class="cursor-marker" id="cursorMarker" style="display:none;"></div>
    <div class="selection-highlight" id="selectionHighlight" style="display:none;"></div>
    <div class="style-menu" id="styleMenu">
        <button data-style="f">blur</button>
        <button data-style="g">gothic</button>
        <button data-style="s">strike</button>
    </div>
</div>

<div class="goto-bottom" id="gotoBottom" style="display:none;">&#8595;</div>

<input class="hidden-input" id="hiddenInput">

<script>
// ===========================================
// ASCII BACKGROUND
// ===========================================

const ASCII_CHARS = ['\u2588', '\u2593', '\u2584', '\u25CF', '\u25CB', '\u2582', '\u201E', ',', ' ', ' ', ' ', ' '];

let asciiImages = []; // store loaded ascii art for repeating
let asciiBgHeight = 0; // current background coverage

async function loadAsciiBackgrounds() {
    try {
        const res = await fetch('images.json');
        const imageList = await res.json();
        if (!imageList.length) return;

        const count = Math.min(imageList.length, 5 + Math.floor(Math.random() * 3));
        const shuffled = imageList.sort(() => Math.random() - 0.5).slice(0, count);
        let loadCount = 0;

        for (let i = 0; i < shuffled.length; i++) {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.src = 'Images/' + shuffled[i];
            img.onload = ((index) => () => {
                const sizes = [80, 100, 120, 140];
                const cols = sizes[Math.floor(Math.random() * sizes.length)];
                const ascii = imageToAscii(img, cols);
                asciiImages[index] = ascii;
                loadCount++;

                if (loadCount === shuffled.length) {
                    asciiImages = asciiImages.filter(a => a);
                    fillAsciiBackground();
                }
            })(i);
        }
    } catch (e) {}
}

function fillAsciiBackground() {
    if (asciiImages.length === 0) return;
    const container = document.getElementById('asciiBg');
    const targetHeight = Math.max(canvasEl.offsetHeight || 3000, currentLineCount * LINE_HEIGHT);

    let currentY = asciiBgHeight || 50;
    let idx = container.children.length;

    while (currentY < targetHeight) {
        const ascii = asciiImages[idx % asciiImages.length];
        const el = document.createElement('div');
        el.className = 'ascii-img';
        el.textContent = ascii;
        el.style.top = currentY + 'px';
        el.style.left = (idx % 2 === 0) ? '5%' : '35%';
        container.appendChild(el);
        const h = el.offsetHeight || 200;
        currentY += h + 150 + Math.floor(Math.random() * 200);
        idx++;
    }
    asciiBgHeight = currentY;
    container.style.height = currentY + 'px';
}

function imageToAscii(img, cols) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const rows = Math.floor(cols * (img.height / img.width) * 0.5);
    canvas.width = cols;
    canvas.height = rows;
    ctx.drawImage(img, 0, 0, cols, rows);
    const pixels = ctx.getImageData(0, 0, cols, rows).data;

    let totalBright = 0;
    for (let i = 0; i < cols * rows; i++) {
        totalBright += 0.299 * pixels[i*4] + 0.587 * pixels[i*4+1] + 0.114 * pixels[i*4+2];
    }
    const invert = (totalBright / (cols * rows)) > 127;

    let ascii = '';
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            const idx = (y * cols + x) * 4;
            let gray = 0.299 * pixels[idx] + 0.587 * pixels[idx+1] + 0.114 * pixels[idx+2];
            if (invert) gray = 255 - gray;
            gray = Math.max(0, Math.min(255, ((gray / 255 - 0.5) * 2.5 + 0.5) * 255));
            const step = 255 / 6;
            gray = Math.floor(gray / step) * step;
            ascii += ASCII_CHARS[Math.min(ASCII_CHARS.length - 1, Math.floor((gray / 255) * ASCII_CHARS.length))];
        }
        ascii += '\n';
    }
    return ascii;
}

loadAsciiBackgrounds();

// ===========================================
// FIREBASE
// ===========================================

const firebaseConfig = {
    apiKey: "AIzaSyBkUvAiNwfM1ZVVDOpNWKrhDyeehs_I9jg",
    authDomain: "the-lake-b8eb9.firebaseapp.com",
    databaseURL: "https://the-lake-b8eb9-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "the-lake-b8eb9",
    storageBucket: "the-lake-b8eb9.firebasestorage.app",
    messagingSenderId: "170372794731",
    appId: "1:170372794731:web:2674110cc4cbbe7500a42e"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const messagesRef = db.ref('firepad/messages');
const usersRef = db.ref('firepad/users');

const myId = 'user_' + Math.random().toString(36).substr(2, 9);
let myName = '';

const canvasEl = document.getElementById('canvas');
const cursorMarker = document.getElementById('cursorMarker');
const hiddenInput = document.getElementById('hiddenInput');
const usersEl = document.getElementById('users');
const usersList = document.getElementById('usersList');
const nameInput = document.getElementById('nameInput');

const LINE_HEIGHT = 48;
const NUM_LINES = 60;

let messages = {}; // key -> {text, x, y, author, authorId}
let activeMessageKey = null; // message currently being typed into
let cursorPos = -1; // position within active message text (-1 = end)
let cursorX = -1, cursorY = -1; // snapped cursor position

// ===========================================
// RULED LINES
// ===========================================

let currentLineCount = NUM_LINES;

function generateRuledLines() {
    canvasEl.style.minHeight = ((NUM_LINES + 1) * LINE_HEIGHT) + 'px';
}

function expandCanvasTo(y) {
    const neededLines = Math.ceil((y + LINE_HEIGHT * 3) / LINE_HEIGHT);
    if (neededLines <= currentLineCount) return;
    currentLineCount = neededLines;
    canvasEl.style.minHeight = ((neededLines + 1) * LINE_HEIGHT) + 'px';
    // Extend ASCII backgrounds to cover new area
    fillAsciiBackground();
}

function snapToLine(y) {
    const lineIndex = Math.round(y / LINE_HEIGHT);
    return Math.max(0, lineIndex * LINE_HEIGHT);
}

generateRuledLines();

// Keep canvas always taller than scroll position so user can always click below
window.addEventListener('scroll', () => {
    const scrollBottom = window.scrollY + window.innerHeight;
    const canvasTop = canvasEl.offsetTop;
    const neededY = scrollBottom - canvasTop + LINE_HEIGHT * 5;
    expandCanvasTo(neededY);
});

// ===========================================
// COLLISION CHECK
// ===========================================

// Estimate text width in pixels (Archivo Narrow 40px bold, ~22px per char average)
const CHAR_WIDTH = 22;

function getMessageWidth(msg) {
    const el = canvasEl.querySelector(`.message[data-key="${msg._key}"]`);
    if (el && el.offsetWidth > 0) return el.offsetWidth;
    // Fallback: estimate from visual text length (without tags)
    const visLen = getVisualLength(msg.text);
    return visLen * CHAR_WIDTH + 20; // +20 for author tag
}

function getMessagesOnLine(y) {
    const result = [];
    for (const [key, msg] of Object.entries(messages)) {
        if (msg.y === y) {
            result.push({ key, msg, left: msg.x, right: msg.x + getMessageWidth({ ...msg, _key: key }) });
        }
    }
    return result;
}

function wouldOverlapOther(x, width, y, excludeKey) {
    // Check if a message at (x, y) with given width would overlap another user's message
    const right = x + width;
    for (const [key, msg] of Object.entries(messages)) {
        if (key === excludeKey) continue;
        if (msg.y !== y) continue;
        if (msg.authorId === myId) continue; // own messages don't block
        const msgWidth = getMessageWidth({ ...msg, _key: key });
        const msgRight = msg.x + msgWidth;
        // Check overlap
        if (x < msgRight && right > msg.x) {
            return true;
        }
    }
    return false;
}

function getMessageAtClick(x, y) {
    // Find message that contains click point
    for (const [key, msg] of Object.entries(messages)) {
        if (msg.y !== y) continue;
        const width = getMessageWidth({ ...msg, _key: key });
        if (x >= msg.x && x <= msg.x + width) {
            return { key, msg };
        }
    }
    return null;
}

function pushMessagesRight(sourceKey) {
    const src = messages[sourceKey];
    if (!src) return;
    const pageWidth = Math.min(canvasEl.offsetWidth, window.innerWidth - 90) || 800;
    const srcRight = src.x + getMessageWidth({ ...src, _key: sourceKey });

    // Get messages that overlap or are to the right of source on the same line
    const sameLine = Object.entries(messages)
        .filter(([k, m]) => {
            if (m.y !== src.y || k === sourceKey) return false;
            // Include if message starts at or after source x
            if (m.x >= src.x) return true;
            // Also include if message overlaps source (starts before but extends into it)
            const mRight = m.x + getMessageWidth({ ...m, _key: k });
            if (mRight > src.x) return true;
            return false;
        })
        .sort((a, b) => a[1].x - b[1].x);

    let pushEdge = srcRight;
    const GAP = 5;

    for (const [key, msg] of sameLine) {
        if (msg.x < pushEdge) {
            let newX = pushEdge + GAP;
            const msgWidth = getMessageWidth({ ...msg, _key: key });

            // If pushed beyond page width, wrap to next line
            if (newX > pageWidth || newX + msgWidth > pageWidth) {
                msg.x = 0;
                msg.y = msg.y + LINE_HEIGHT;
                messagesRef.child(key).update({ x: 0, y: msg.y });
                // Now check if this message overlaps anything on its new line
                pushMessagesRight(key);
                pushEdge = newX;
            } else {
                msg.x = newX;
                messagesRef.child(key).update({ x: newX });
                pushEdge = newX + msgWidth;
            }
        } else {
            break;
        }
    }
}

function pushMessagesDown(cx, cy) {
    // Push all messages to the right of cursor on this line down one line
    const sameLine = Object.entries(messages)
        .filter(([k, m]) => m.y === cy && m.x >= cx)
        .sort((a, b) => a[1].x - b[1].x);

    if (sameLine.length === 0) return;

    // First move all of them down
    for (const [key, msg] of sameLine) {
        msg.y = msg.y + LINE_HEIGHT;
        messagesRef.child(key).update({ y: msg.y });
    }
    // Then resolve collisions on the new line (push existing messages right)
    for (const [key, msg] of sameLine) {
        pushMessagesRight(key);
    }
}

function pullNextMessageLeft(cx, cy) {
    // Find the first message to the right of cursor on this line
    const sameLine = Object.entries(messages)
        .filter(([k, m]) => m.y === cy && m.x > cx)
        .sort((a, b) => a[1].x - b[1].x);

    if (sameLine.length === 0) return;

    const [key, msg] = sameLine[0];
    const step = CHAR_WIDTH; // pull by one character width

    // Find the boundary: either cursor position or end of previous message
    let minX = cx;
    const leftMessages = Object.entries(messages)
        .filter(([k, m]) => m.y === cy && m.x < msg.x && k !== key)
        .sort((a, b) => b[1].x - a[1].x); // sorted right to left

    if (leftMessages.length > 0) {
        const [lk, lm] = leftMessages[0];
        const leftRight = lm.x + getMessageWidth({ ...lm, _key: lk });
        minX = Math.max(minX, leftRight + 5);
    }

    const newX = Math.max(minX, msg.x - step);
    if (newX !== msg.x) {
        msg.x = newX;
        messagesRef.child(key).update({ x: newX });
    }
}

// ===========================================
// NAME INPUT
// ===========================================

nameInput.addEventListener('input', () => {
    const newName = nameInput.value.trim();
    if (newName !== myName) {
        myName = newName;
        usersRef.child(myId).set(myName || 'anonymous');
    }
});

nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        hiddenInput.focus();
    }
});

// ===========================================
// CLICK / DRAG TO PLACE CURSOR OR SELECT
// ===========================================

let dragState = null; // {startKey, startCharIdx, startX, startY, moved}
const selectionHighlight = document.getElementById('selectionHighlight');
const styleMenu = document.getElementById('styleMenu');
let currentSelection = null; // [{key, startIdx, endIdx}, ...] array of selections per message

canvasEl.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    hideStyleMenu();
    const rect = canvasEl.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = snapToLine(e.clientY - rect.top);

    const hit = getMessageAtClick(mx, my);
    if (hit && hit.msg.authorId !== myId) {
        // Start drag selection on another user's message (use visual length)
        const visLen = getVisualLength(hit.msg.text);
        const charIdx = Math.max(0, Math.min(visLen, Math.round((mx - hit.msg.x) / CHAR_WIDTH)));
        dragState = { startKey: hit.key, startCharIdx: charIdx, startX: mx, startY: my, moved: false, endKey: hit.key, endCharIdx: charIdx };
        selectionHighlight.style.display = 'none';
        // Remove old highlight divs
        canvasEl.querySelectorAll('.selection-highlight-multi').forEach(el => el.remove());
        e.preventDefault();
        return;
    }
    // Normal click (own message or empty space)
    dragState = null;
    e.preventDefault();
    handleClick(mx, my);
});

canvasEl.addEventListener('mousemove', (e) => {
    if (!dragState) return;
    dragState.moved = true;
    const rect = canvasEl.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = snapToLine(e.clientY - rect.top);

    // Find which message the mouse is over now
    const hit = getMessageAtClick(mx, my);
    if (hit && hit.msg.authorId !== myId) {
        const visLen = getVisualLength(hit.msg.text);
        const charIdx = Math.max(0, Math.min(visLen, Math.round((mx - hit.msg.x) / CHAR_WIDTH)));
        dragState.endKey = hit.key;
        dragState.endCharIdx = charIdx;
    } else {
        // If over empty space, keep last known end
    }

    // Calculate and show selection highlights
    showDragHighlight();
});

canvasEl.addEventListener('mouseup', (e) => {
    if (!dragState) return;

    if (dragState.moved) {
        // Build selection from drag range
        const selections = getSelectionsFromDrag();
        if (selections.length > 0) {
            currentSelection = selections;
            // Position menu near the first selection
            const firstMsg = messages[selections[0].key];
            if (firstMsg) {
                const menuX = firstMsg.x + selections[0].startIdx * CHAR_WIDTH;
                const menuY = firstMsg.y - 40;
                styleMenu.style.left = menuX + 'px';
                styleMenu.style.top = Math.max(0, menuY) + 'px';
                styleMenu.style.display = 'flex';
            }
            dragState = null;
            return;
        }
    }

    // No valid selection or no drag: treat as normal click
    selectionHighlight.style.display = 'none';
    canvasEl.querySelectorAll('.selection-highlight-multi').forEach(el => el.remove());
    const clickX = dragState.startX;
    const clickY = dragState.startY;
    dragState = null;
    handleClick(clickX, clickY);
});


function handleClick(clickX, clickY) {
    const hit = getMessageAtClick(clickX, clickY);
    if (hit) {
        if (hit.msg.authorId === myId) {
            activeMessageKey = hit.key;
            const charIndex = Math.round((clickX - hit.msg.x) / CHAR_WIDTH);
            cursorPos = Math.max(0, Math.min(hit.msg.text.length, charIndex));
            cursorX = -1;
            cursorY = -1;
            hideCursor();
            hiddenInput.focus();
            renderMessages();
            return;
        } else {
            activeMessageKey = null;
            cursorX = clickX;
            cursorY = clickY;
            showCursor(cursorX, cursorY);
            renderMessages();
            hiddenInput.focus();
            return;
        }
    }

    activeMessageKey = null;
    cursorX = clickX;
    cursorY = clickY;
    showCursor(cursorX, cursorY);
    renderMessages();
    hiddenInput.focus();
}

function getSelectionsFromDrag() {
    if (!dragState) return [];
    const startMsg = messages[dragState.startKey];
    const endMsg = messages[dragState.endKey];
    if (!startMsg || !endMsg) return [];

    // If same message
    if (dragState.startKey === dragState.endKey) {
        const s = Math.min(dragState.startCharIdx, dragState.endCharIdx);
        const e = Math.max(dragState.startCharIdx, dragState.endCharIdx);
        if (s === e) return [];
        return [{ key: dragState.startKey, startIdx: s, endIdx: e }];
    }

    // Multiple messages: find all messages between startY and endY
    const yStart = Math.min(startMsg.y, endMsg.y);
    const yEnd = Math.max(startMsg.y, endMsg.y);
    const goingDown = startMsg.y <= endMsg.y;

    // Get all other-user messages in y range, sorted by y then x
    const inRange = Object.entries(messages)
        .filter(([k, m]) => m.y >= yStart && m.y <= yEnd && m.authorId !== myId)
        .sort((a, b) => a[1].y - b[1].y || a[1].x - b[1].x);

    const selections = [];
    for (const [k, m] of inRange) {
        const visLen = getVisualLength(m.text);
        let s = 0, e = visLen;

        if (k === dragState.startKey) {
            if (goingDown) { s = dragState.startCharIdx; e = visLen; }
            else { s = 0; e = dragState.startCharIdx; }
        } else if (k === dragState.endKey) {
            if (goingDown) { s = 0; e = dragState.endCharIdx; }
            else { s = dragState.endCharIdx; e = visLen; }
        }

        if (s < e) {
            selections.push({ key: k, startIdx: s, endIdx: e });
        }
    }
    return selections;
}

function showDragHighlight() {
    // Remove old highlights
    canvasEl.querySelectorAll('.selection-highlight-multi').forEach(el => el.remove());
    selectionHighlight.style.display = 'none';

    const selections = getSelectionsFromDrag();
    for (const sel of selections) {
        const msg = messages[sel.key];
        if (!msg) continue;
        const hl = document.createElement('div');
        hl.className = 'selection-highlight selection-highlight-multi';
        hl.style.left = (msg.x + sel.startIdx * CHAR_WIDTH) + 'px';
        hl.style.top = msg.y + 'px';
        hl.style.width = ((sel.endIdx - sel.startIdx) * CHAR_WIDTH) + 'px';
        hl.style.display = 'block';
        canvasEl.appendChild(hl);
    }
}

// Convert a visual character index (what user sees) to raw text index (with tags)
function visualToRawIndex(text, visualIdx) {
    let visual = 0;
    let raw = 0;
    while (raw < text.length && visual < visualIdx) {
        // Check if we're at a tag opening: >x followed by optional space
        if (text[raw] === '>' && raw + 1 < text.length && /[iIfFsSgG]/.test(text[raw + 1])) {
            raw += 2; // skip >x
            if (raw < text.length && text[raw] === ' ') raw++; // skip optional space
            continue;
        }
        // Check for " <" (space + closing tag)
        if (raw + 1 < text.length && text[raw] === ' ' && text[raw + 1] === '<') {
            raw += 2;
            continue;
        }
        // Check for "<" alone (closing tag without space)
        if (text[raw] === '<') {
            raw++;
            continue;
        }
        // Normal visible character
        visual++;
        raw++;
    }
    // If we've reached target visual index, skip any trailing tag markers
    return raw;
}

// Get the visual length of a text (without tag markers)
function getVisualLength(text) {
    let len = 0;
    let i = 0;
    while (i < text.length) {
        if (text[i] === '>' && i + 1 < text.length && /[iIfFsSgG]/.test(text[i + 1])) {
            i += 2;
            if (i < text.length && text[i] === ' ') i++;
            continue;
        }
        if (i + 1 < text.length && text[i] === ' ' && text[i + 1] === '<') {
            i += 2;
            continue;
        }
        if (text[i] === '<') {
            i++;
            continue;
        }
        len++;
        i++;
    }
    return len;
}

// Style menu button handlers
styleMenu.addEventListener('mousedown', (e) => {
    // Prevent the document mousedown from hiding the menu
    e.stopPropagation();
});

styleMenu.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-style]');
    if (!btn || !currentSelection || !currentSelection.length) return;
    const tag = btn.dataset.style;

    // Apply tag to each selection (in reverse order to preserve indices)
    const sorted = [...currentSelection].sort((a, b) => {
        const ma = messages[a.key], mb = messages[b.key];
        if (!ma || !mb) return 0;
        return mb.y - ma.y || mb.x - ma.x || b.startIdx - a.startIdx;
    });

    for (const sel of sorted) {
        const msg = messages[sel.key];
        if (!msg) continue;
        // Convert visual indices to raw text indices
        const rawStart = visualToRawIndex(msg.text, sel.startIdx);
        const rawEnd = visualToRawIndex(msg.text, sel.endIdx);
        const before = msg.text.slice(0, rawStart);
        const selected = msg.text.slice(rawStart, rawEnd);
        const after = msg.text.slice(rawEnd);
        if (selected.length === 0) continue;
        const newText = before + '>' + tag + ' ' + selected + ' <' + after;
        msg.text = newText;
        messagesRef.child(sel.key).update({ text: newText });
    }

    hideStyleMenu();
    renderMessages();
});

function hideStyleMenu() {
    styleMenu.style.display = 'none';
    selectionHighlight.style.display = 'none';
    canvasEl.querySelectorAll('.selection-highlight-multi').forEach(el => el.remove());
    currentSelection = null;
}

// Hide menu when clicking outside
document.addEventListener('mousedown', (e) => {
    if (styleMenu.contains(e.target)) return;
    if (currentSelection) {
        hideStyleMenu();
    }
});

function showCursor(x, y) {
    expandCanvasTo(y);
    cursorMarker.style.left = x + 'px';
    cursorMarker.style.top = y + 'px';
    cursorMarker.style.display = 'block';
}

function hideCursor() {
    cursorMarker.style.display = 'none';
}

// ===========================================
// TYPING
// ===========================================

hiddenInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();

        if (activeMessageKey) {
            // Inside own message: split at cursorPos
            const msg = messages[activeMessageKey];
            if (msg && msg.authorId === myId) {
                if (cursorPos < 0) cursorPos = msg.text.length;
                const textBefore = msg.text.slice(0, cursorPos);
                const textAfter = msg.text.slice(cursorPos);
                const nextY = msg.y + LINE_HEIGHT;

                // Update current message with text before cursor
                if (textBefore.length === 0) {
                    // Nothing before: delete this message
                    messagesRef.child(activeMessageKey).remove();
                } else {
                    msg.text = textBefore;
                    messagesRef.child(activeMessageKey).update({ text: textBefore });
                }

                // Push messages on next line to make room
                pushMessagesDown(0, nextY);

                if (textAfter.length > 0) {
                    // Create new message on next line with text after cursor
                    const ref = messagesRef.push({
                        text: textAfter,
                        x: msg.x,
                        y: nextY,
                        author: myName,
                        authorId: myId,
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    });
                    activeMessageKey = ref.key;
                    cursorPos = 0;
                    messages[ref.key] = {
                        text: textAfter,
                        x: msg.x,
                        y: nextY,
                        author: myName,
                        authorId: myId
                    };
                    pushMessagesRight(ref.key);
                } else {
                    // Nothing after: just move cursor to next line
                    activeMessageKey = null;
                    cursorPos = -1;
                    cursorX = msg.x;
                    cursorY = nextY;
                    showCursor(cursorX, cursorY);
                }
                renderMessages();
                return;
            }
        }

        // Cursor in empty space
        const currentX = cursorX;
        const currentY = cursorY;

        if (cursorX >= 0) {
            pushMessagesDown(cursorX, cursorY);
        }

        // Move cursor to next line
        const nextY = currentY + LINE_HEIGHT;
        activeMessageKey = null;
        cursorPos = -1;
        cursorX = currentX;
        cursorY = nextY;
        showCursor(cursorX, cursorY);
        renderMessages();
        return;
    }

    if (e.key === 'Backspace') {
        e.preventDefault();
        if (activeMessageKey) {
            // Editing own message: delete char before cursorPos
            const msg = messages[activeMessageKey];
            if (msg && msg.authorId === myId) {
                if (cursorPos < 0) cursorPos = msg.text.length;
                if (cursorPos === 0) {
                    // At start, nothing to delete backwards
                    renderMessages();
                    return;
                }
                if (msg.text.length <= 1) {
                    messagesRef.child(activeMessageKey).remove();
                    cursorX = msg.x;
                    cursorY = msg.y;
                    activeMessageKey = null;
                    cursorPos = -1;
                    showCursor(cursorX, cursorY);
                } else {
                    const newText = msg.text.slice(0, cursorPos - 1) + msg.text.slice(cursorPos);
                    cursorPos--;
                    msg.text = newText;
                    messagesRef.child(activeMessageKey).update({ text: newText });
                }
            }
        } else if (cursorX >= 0) {
            // Cursor in empty space: pull the next message on this line closer
            pullNextMessageLeft(cursorX, cursorY);
        }
        renderMessages();
        return;
    }

    if (e.key === 'Delete') {
        e.preventDefault();
        if (cursorX >= 0 && !activeMessageKey) {
            // Delete in empty space: pull next message left
            pullNextMessageLeft(cursorX, cursorY);
            renderMessages();
        }
        return;
    }

    // Arrow keys
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();

        if (activeMessageKey) {
            const msg = messages[activeMessageKey];
            if (msg && msg.authorId === myId) {
                if (cursorPos < 0) cursorPos = msg.text.length;

                if (e.key === 'ArrowLeft') {
                    if (cursorPos > 0) {
                        cursorPos--;
                        renderMessages();
                        return;
                    }
                    // At start of message: leave message, place cursor before it
                    cursorX = Math.max(0, msg.x - 5);
                    cursorY = msg.y;
                    activeMessageKey = null;
                    cursorPos = -1;
                    showCursor(cursorX, cursorY);
                    renderMessages();
                    return;
                }
                if (e.key === 'ArrowRight') {
                    if (cursorPos < msg.text.length) {
                        cursorPos++;
                        renderMessages();
                        return;
                    }
                    // At end of message: leave message, place cursor after it
                    cursorX = msg.x + getMessageWidth({ ...msg, _key: activeMessageKey });
                    cursorY = msg.y;
                    activeMessageKey = null;
                    cursorPos = -1;
                    showCursor(cursorX, cursorY);
                    renderMessages();
                    return;
                }
                if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                    // Leave message, move to line above/below
                    cursorX = msg.x + cursorPos * CHAR_WIDTH;
                    cursorY = msg.y + (e.key === 'ArrowUp' ? -LINE_HEIGHT : LINE_HEIGHT);
                    cursorY = Math.max(0, cursorY);
                    activeMessageKey = null;
                    cursorPos = -1;
                    showCursor(cursorX, cursorY);
                    renderMessages();
                    return;
                }
            }
        }

        let cx = cursorX;
        let cy = cursorY;

        if (e.key === 'ArrowUp') cy = Math.max(0, cy - LINE_HEIGHT);
        if (e.key === 'ArrowDown') cy = cy + LINE_HEIGHT;
        if (e.key === 'ArrowLeft') cx = Math.max(0, cx - 20);
        if (e.key === 'ArrowRight') cx = cx + 20;

        cursorX = cx;
        cursorY = cy;
        showCursor(cursorX, cursorY);
        renderMessages();
        return;
    }
});

hiddenInput.addEventListener('input', () => {
    const typed = hiddenInput.value;
    hiddenInput.value = '';
    if (!typed) return;

    if (activeMessageKey) {
        // Insert at cursorPos — push others if needed
        const msg = messages[activeMessageKey];
        if (msg && msg.authorId === myId) {
            if (cursorPos < 0) cursorPos = msg.text.length;
            const newText = msg.text.slice(0, cursorPos) + typed + msg.text.slice(cursorPos);
            cursorPos += typed.length;
            msg.text = newText;
            messagesRef.child(activeMessageKey).update({ text: newText });

            // Check if message exceeds page width → wrap to next line(s)
            const pageWidth = Math.min(canvasEl.offsetWidth, window.innerWidth - 90) || 800;
            let currentKey = activeMessageKey;
            let currentMsg = msg;
            while (true) {
                const cW = currentMsg.text.length * CHAR_WIDTH + 20;
                if (currentMsg.x + cW <= pageWidth) break;
                // Find split point
                const maxChars = Math.max(1, Math.floor((pageWidth - currentMsg.x - 20) / CHAR_WIDTH));
                const splitPos = Math.min(maxChars, currentMsg.text.length);
                const textBefore = currentMsg.text.slice(0, splitPos);
                const textAfter = currentMsg.text.slice(splitPos);
                const nextY = currentMsg.y + LINE_HEIGHT;

                currentMsg.text = textBefore;
                messagesRef.child(currentKey).update({ text: textBefore });

                pushMessagesDown(0, nextY);

                const ref2 = messagesRef.push({
                    text: textAfter || '', x: 0, y: nextY,
                    author: myName, authorId: myId,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                messages[ref2.key] = {
                    text: textAfter || '', x: 0, y: nextY,
                    author: myName, authorId: myId
                };
                currentKey = ref2.key;
                currentMsg = messages[ref2.key];
            }
            activeMessageKey = currentKey;
            cursorPos = currentMsg.text.length;
            pushMessagesRight(activeMessageKey);
            renderMessages();
        }
        return;
    }

    if (cursorX < 0) return;

    // Create new message
    const ref = messagesRef.push({
        text: typed,
        x: cursorX,
        y: cursorY,
        author: myName,
        authorId: myId,
        timestamp: firebase.database.ServerValue.TIMESTAMP
    });

    activeMessageKey = ref.key;
    cursorPos = typed.length;
    messages[ref.key] = {
        text: typed,
        x: cursorX,
        y: cursorY,
        author: myName,
        authorId: myId
    };
    hideCursor();
    // Push any overlapping messages to the right
    pushMessagesRight(activeMessageKey);
    renderMessages();
});

// ===========================================
// RENDER
// ===========================================

function renderMessages() {
    // Remove all message elements
    canvasEl.querySelectorAll('.message').forEach(el => el.remove());

    for (const [key, msg] of Object.entries(messages)) {
        expandCanvasTo(msg.y);
        const el = document.createElement('div');
        el.className = 'message';
        el.dataset.key = key;
        el.style.left = msg.x + 'px';
        el.style.top = msg.y + 'px';

        let html = '';
        const cursorStyle = 'display:inline-block;width:2px;height:48px;background:#4a9f7e;vertical-align:text-bottom;animation:blink 1s step-end infinite;';

        // Show cursor at cursorPos inside active message (show raw text with tags)
        if (key === activeMessageKey) {
            const pos = cursorPos < 0 ? msg.text.length : Math.min(cursorPos, msg.text.length);
            html = escapeHtml(msg.text.slice(0, pos))
                + '<span style="' + cursorStyle + '"></span>'
                + escapeHtml(msg.text.slice(pos));
        } else {
            // Parse >i ... < and >f ... < tags
            html = formatTags(msg.text);
        }

        if (msg.author) {
            html += '<span class="author-tag">' + escapeHtml(msg.author) + '</span>';
        }

        el.innerHTML = html;
        canvasEl.appendChild(el);
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function formatTags(text) {
    // Parse >i ... < (italic) and >f ... < (blur) tags
    let result = '';
    let i = 0;
    while (i < text.length) {
        if (text[i] === '>' && (text[i+1] === 'i' || text[i+1] === 'I' || text[i+1] === 'f' || text[i+1] === 'F' || text[i+1] === 's' || text[i+1] === 'S' || text[i+1] === 'g' || text[i+1] === 'G')) {
            const tag = text[i+1].toLowerCase();
            const start = i + 2;
            const end = text.indexOf('<', start);
            if (end !== -1) {
                const contentStart = (text[start] === ' ') ? start + 1 : start;
                const contentEnd = (text[end-1] === ' ') ? end - 1 : end;
                const content = escapeHtml(text.slice(contentStart, contentEnd));
                if (tag === 'i') {
                    result += '<i>' + content + '</i>';
                } else if (tag === 'f') {
                    result += '<span style="filter:blur(4px)">' + content + '</span>';
                } else if (tag === 's') {
                    result += '<s>' + content + '</s>';
                } else {
                    result += '<span style="font-family:UnifrakturMaguntia,serif">' + content + '</span>';
                }
                i = end + 1;
            } else {
                const contentStart = (text[start] === ' ') ? start + 1 : start;
                const content = escapeHtml(text.slice(contentStart));
                if (tag === 'i') {
                    result += '<i>' + content + '</i>';
                } else if (tag === 'f') {
                    result += '<span style="filter:blur(4px)">' + content + '</span>';
                } else if (tag === 's') {
                    result += '<s>' + content + '</s>';
                } else {
                    result += '<span style="font-family:UnifrakturMaguntia,serif">' + content + '</span>';
                }
                i = text.length;
            }
        } else {
            let next = i;
            while (next < text.length) {
                if (text[next] === '>' && (text[next+1] === 'i' || text[next+1] === 'I' || text[next+1] === 'f' || text[next+1] === 'F' || text[next+1] === 's' || text[next+1] === 'S' || text[next+1] === 'g' || text[next+1] === 'G')) break;
                next++;
            }
            result += escapeHtml(text.slice(i, next));
            i = next;
        }
    }
    return result;
}

// ===========================================
// FIREBASE LISTENER
// ===========================================

messagesRef.on('child_added', (snapshot) => {
    const key = snapshot.key;
    const val = snapshot.val();
    messages[key] = {
        text: val.text || '',
        x: val.x || 0,
        y: val.y || 0,
        author: val.author || '',
        authorId: val.authorId || '',
        timestamp: val.timestamp || 0
    };
    renderMessages();
});

messagesRef.on('child_changed', (snapshot) => {
    const key = snapshot.key;
    const val = snapshot.val();
    messages[key] = {
        text: val.text || '',
        x: val.x || 0,
        y: val.y || 0,
        author: val.author || '',
        authorId: val.authorId || '',
        timestamp: val.timestamp || 0
    };
    renderMessages();
});

messagesRef.on('child_removed', (snapshot) => {
    delete messages[snapshot.key];
    renderMessages();
});

// ===========================================
// PRESENCE
// ===========================================

const myPresence = usersRef.child(myId);
myPresence.set(myName || 'anonymous');
myPresence.onDisconnect().remove();

usersRef.on('value', (snapshot) => {
    const users = snapshot.val();
    if (users) {
        const names = Object.values(users);
        usersEl.textContent = names.length;
        usersList.innerHTML = names.map(n => `<span>${n}</span>`).join('');
    } else {
        usersEl.textContent = '0';
        usersList.innerHTML = '';
    }
});

hiddenInput.focus();

// ===========================================
// GO TO BOTTOM BUTTON
// ===========================================

const gotoBottom = document.getElementById('gotoBottom');

function getLastMessageY() {
    let maxY = 0;
    for (const msg of Object.values(messages)) {
        if (msg.y > maxY) maxY = msg.y;
    }
    return maxY;
}

function updateGotoButton() {
    const lastY = getLastMessageY();
    if (lastY === 0) {
        gotoBottom.style.display = 'none';
        return;
    }
    const canvasTop = canvasEl.offsetTop;
    const lastAbsolute = canvasTop + lastY;
    const viewBottom = window.scrollY + window.innerHeight;

    // Show button if last message is below the viewport
    if (lastAbsolute > viewBottom + 100) {
        gotoBottom.style.display = 'flex';
    } else {
        gotoBottom.style.display = 'none';
    }
}

gotoBottom.addEventListener('click', () => {
    const lastY = getLastMessageY();
    const canvasTop = canvasEl.offsetTop;
    window.scrollTo({ top: canvasTop + lastY - window.innerHeight + 200, behavior: 'smooth' });
});

window.addEventListener('scroll', updateGotoButton);
// Update when messages change
const origRender = renderMessages;
renderMessages = function() {
    origRender();
    updateGotoButton();
};
</script>
