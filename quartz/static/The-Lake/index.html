<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE LAKE</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@700&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            background: #000;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ASCII background images */
        .ascii-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .ascii-img {
            position: absolute;
            font-family: 'SF Mono', 'Monaco', monospace;
            font-size: 9px;
            line-height: 1.1;
            white-space: pre;
            color: #fff;
            opacity: 0.2;
        }

        /* Header */
        .header-ascii {
            position: relative;
            z-index: 1;
            width: 100%;
        }

        .header-ascii img {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0.6;
        }

        .subtitle-bar {
            position: relative;
            z-index: 10;
            margin-top: 15px;
            padding: 10px 30px;
            border-top: 1px dashed #555;
            border-bottom: 1px dashed #555;
            display: flex;
            justify-content: space-between;
            font-family: 'SF Mono', 'Monaco', monospace;
            font-size: 12px;
            color: #fff;
        }

        .title-section {
            position: relative;
            z-index: 10;
            padding: 20px 30px 40px;
        }

        .title {
            font-family: 'Inter', 'Helvetica Neue', sans-serif;
            font-size: 120px;
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 0.9;
        }

        .info-line {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-top: 15px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .online {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #4a9f7e;
            flex-shrink: 0;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #4a9f7e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .users-list {
            margin-left: 12px;
            font-size: 12px;
            color: #555;
        }
        .users-list span {
            display: inline;
            margin-right: 12px;
            color: #4a9f7e;
        }

        .name-inline {
            flex-shrink: 0;
            margin-left: auto;
        }

        .name-inline input {
            font-family: 'SF Mono', monospace;
            font-size: 12px;
            background: transparent;
            border: none;
            border-bottom: 1px solid #fff;
            color: #fff;
            padding: 4px 0;
            outline: none;
            width: 150px;
            text-align: right;
        }

        .name-inline input::placeholder {
            color: #888;
        }

        /* Canvas area where messages live */
        .canvas {
            position: relative;
            z-index: 10;
            min-height: 80vh;
            margin: 0 30px 100px;
            cursor: text;
        }

        /* Ruled lines */
        .ruled-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .ruled-line {
            position: absolute;
            left: 0;
            width: 100%;
            height: 1px;
            background: #1a1a1a;
        }

        /* Each message positioned absolutely, snapped to line */
        .message {
            position: absolute;
            font-family: 'Archivo Narrow', sans-serif;
            font-size: 40px;
            font-weight: 700;
            line-height: 48px;
            height: 48px;
            white-space: pre;
            overflow: hidden;
            pointer-events: none;
        }

        .message .author-tag {
            color: #555;
            font-size: 9px;
            font-family: 'SF Mono', monospace;
            vertical-align: super;
            margin-left: 2px;
        }

        /* Blinking cursor */
        .cursor-marker {
            position: absolute;
            display: inline-block;
            width: 2px;
            height: 48px;
            background: #4a9f7e;
            animation: blink 1s step-end infinite;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Hidden input for typing */
        .hidden-input {
            position: fixed;
            top: -100px;
            left: -100px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="header-ascii">
    <img src="Header/header_ascii.png" alt="The Lake">
</div>

<div class="subtitle-bar"><span>A project by Sylvain Couzinet-Jacques</span><span>Retcon Black Mountain</span></div>

<div class="title-section">
    <div class="title">The Lake</div>
    <div class="info-line">
        <div class="online"><span class="dot"></span><span id="users">0</span> online<span class="users-list" id="usersList"></span></div>
        <div class="name-inline"><input type="text" id="nameInput" placeholder="Name (optional)"></div>
    </div>
</div>

<div class="canvas" id="canvas">
    <div class="ascii-bg" id="asciiBg"></div>
    <div class="ruled-lines" id="ruledLines"></div>
    <div class="cursor-marker" id="cursorMarker" style="display:none;"></div>
</div>

<input class="hidden-input" id="hiddenInput">

<script>
// ===========================================
// ASCII BACKGROUND
// ===========================================

const ASCII_CHARS = ['\u2588', '\u2593', '\u2584', '\u25CF', '\u25CB', '\u2582', '\u201E', ',', ' ', ' ', ' ', ' '];

async function loadAsciiBackgrounds() {
    try {
        const res = await fetch('images.json');
        const imageList = await res.json();
        if (!imageList.length) return;

        const count = Math.min(imageList.length, 3 + Math.floor(Math.random() * 3));
        const shuffled = imageList.sort(() => Math.random() - 0.5).slice(0, count);
        const container = document.getElementById('asciiBg');
        const startY = 50;
        const loaded = [];
        let loadCount = 0;

        for (let i = 0; i < shuffled.length; i++) {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.src = 'Images/' + shuffled[i];
            img.onload = ((index) => () => {
                const sizes = [80, 100, 120, 140];
                const cols = sizes[Math.floor(Math.random() * sizes.length)];
                const ascii = imageToAscii(img, cols);
                loaded[index] = { ascii };
                loadCount++;

                if (loadCount === shuffled.length) {
                    let currentY = startY;
                    for (let j = 0; j < loaded.length; j++) {
                        if (!loaded[j]) continue;
                        const el = document.createElement('div');
                        el.className = 'ascii-img';
                        el.textContent = loaded[j].ascii;
                        el.style.top = currentY + 'px';
                        el.style.left = (j % 2 === 0) ? '5%' : '35%';
                        container.appendChild(el);
                        const h = el.offsetHeight || 200;
                        currentY += h + 150;
                    }
                    container.style.height = currentY + 'px';
                }
            })(i);
        }
    } catch (e) {}
}

function imageToAscii(img, cols) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const rows = Math.floor(cols * (img.height / img.width) * 0.5);
    canvas.width = cols;
    canvas.height = rows;
    ctx.drawImage(img, 0, 0, cols, rows);
    const pixels = ctx.getImageData(0, 0, cols, rows).data;

    let totalBright = 0;
    for (let i = 0; i < cols * rows; i++) {
        totalBright += 0.299 * pixels[i*4] + 0.587 * pixels[i*4+1] + 0.114 * pixels[i*4+2];
    }
    const invert = (totalBright / (cols * rows)) > 127;

    let ascii = '';
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            const idx = (y * cols + x) * 4;
            let gray = 0.299 * pixels[idx] + 0.587 * pixels[idx+1] + 0.114 * pixels[idx+2];
            if (invert) gray = 255 - gray;
            gray = Math.max(0, Math.min(255, ((gray / 255 - 0.5) * 2.5 + 0.5) * 255));
            const step = 255 / 6;
            gray = Math.floor(gray / step) * step;
            ascii += ASCII_CHARS[Math.min(ASCII_CHARS.length - 1, Math.floor((gray / 255) * ASCII_CHARS.length))];
        }
        ascii += '\n';
    }
    return ascii;
}

loadAsciiBackgrounds();

// ===========================================
// FIREBASE
// ===========================================

const firebaseConfig = {
    apiKey: "AIzaSyBkUvAiNwfM1ZVVDOpNWKrhDyeehs_I9jg",
    authDomain: "the-lake-b8eb9.firebaseapp.com",
    databaseURL: "https://the-lake-b8eb9-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "the-lake-b8eb9",
    storageBucket: "the-lake-b8eb9.firebasestorage.app",
    messagingSenderId: "170372794731",
    appId: "1:170372794731:web:2674110cc4cbbe7500a42e"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const messagesRef = db.ref('firepad/messages');
const usersRef = db.ref('firepad/users');

const myId = 'user_' + Math.random().toString(36).substr(2, 9);
let myName = '';

const canvasEl = document.getElementById('canvas');
const cursorMarker = document.getElementById('cursorMarker');
const hiddenInput = document.getElementById('hiddenInput');
const usersEl = document.getElementById('users');
const usersList = document.getElementById('usersList');
const nameInput = document.getElementById('nameInput');

const LINE_HEIGHT = 48;
const NUM_LINES = 60;

let messages = {}; // key -> {text, x, y, author, authorId}
let activeMessageKey = null; // message currently being typed into
let cursorX = -1, cursorY = -1; // snapped cursor position

// ===========================================
// RULED LINES
// ===========================================

function generateRuledLines() {
    const container = document.getElementById('ruledLines');
    for (let i = 0; i < NUM_LINES; i++) {
        const line = document.createElement('div');
        line.className = 'ruled-line';
        line.style.top = ((i + 1) * LINE_HEIGHT) + 'px';
        container.appendChild(line);
    }
    canvasEl.style.minHeight = ((NUM_LINES + 1) * LINE_HEIGHT) + 'px';
}

function snapToLine(y) {
    const lineIndex = Math.round(y / LINE_HEIGHT);
    return Math.max(0, lineIndex * LINE_HEIGHT);
}

generateRuledLines();

// ===========================================
// COLLISION CHECK
// ===========================================

function isLineOccupiedByOther(y, excludeKey) {
    // Check if any message from another user occupies this line
    for (const [key, msg] of Object.entries(messages)) {
        if (key === excludeKey) continue;
        if (msg.authorId !== myId && msg.y === y) {
            return msg; // return the blocking message
        }
    }
    return null;
}

function getMyMessageOnLine(y) {
    // Check if I already have a message on this line
    for (const [key, msg] of Object.entries(messages)) {
        if (msg.authorId === myId && msg.y === y) {
            return key;
        }
    }
    return null;
}

// ===========================================
// NAME INPUT
// ===========================================

nameInput.addEventListener('input', () => {
    const newName = nameInput.value.trim();
    if (newName !== myName) {
        myName = newName;
        usersRef.child(myId).set(myName || 'anonymous');
    }
});

nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        hiddenInput.focus();
    }
});

// ===========================================
// CLICK TO PLACE CURSOR
// ===========================================

canvasEl.addEventListener('click', (e) => {
    const rect = canvasEl.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = snapToLine(e.clientY - rect.top);

    // Check if this line is occupied by another user
    const blocker = isLineOccupiedByOther(clickY, null);
    if (blocker) {
        // Can't write on this line — ignore click
        return;
    }

    // Check if I already have a message on this line
    const existingKey = getMyMessageOnLine(clickY);
    if (existingKey) {
        // Resume editing my existing message on this line
        activeMessageKey = existingKey;
        cursorX = -1;
        cursorY = -1;
        hideCursor();
        hiddenInput.focus();
        renderMessages();
        return;
    }

    // Stop current editing
    activeMessageKey = null;
    cursorX = clickX;
    cursorY = clickY;

    showCursor(cursorX, cursorY);
    renderMessages();
    hiddenInput.focus();
});

function showCursor(x, y) {
    cursorMarker.style.left = x + 'px';
    cursorMarker.style.top = y + 'px';
    cursorMarker.style.display = 'block';
}

function hideCursor() {
    cursorMarker.style.display = 'none';
}

// ===========================================
// TYPING
// ===========================================

hiddenInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        // Move cursor to next free line
        let nextY = (activeMessageKey ? messages[activeMessageKey].y : cursorY) + LINE_HEIGHT;
        // Skip lines occupied by others
        while (isLineOccupiedByOther(nextY, null) && nextY < NUM_LINES * LINE_HEIGHT) {
            nextY += LINE_HEIGHT;
        }
        activeMessageKey = null;

        // Check if I have a message on that line already
        const existingKey = getMyMessageOnLine(nextY);
        if (existingKey) {
            activeMessageKey = existingKey;
            cursorX = -1;
            cursorY = -1;
            hideCursor();
        } else {
            cursorX = 0;
            cursorY = nextY;
            showCursor(cursorX, cursorY);
        }
        renderMessages();
        return;
    }

    if (e.key === 'Backspace') {
        e.preventDefault();
        if (activeMessageKey) {
            const msg = messages[activeMessageKey];
            if (msg && msg.authorId === myId) {
                if (msg.text.length <= 1) {
                    // Delete the message entirely
                    messagesRef.child(activeMessageKey).remove();
                    cursorX = msg.x;
                    cursorY = msg.y;
                    activeMessageKey = null;
                    showCursor(cursorX, cursorY);
                } else {
                    const newText = msg.text.slice(0, -1);
                    messagesRef.child(activeMessageKey).update({ text: newText });
                }
            }
        }
        return;
    }

    // Ignore special keys
    if (e.key.length > 1) return;
});

hiddenInput.addEventListener('input', () => {
    const typed = hiddenInput.value;
    hiddenInput.value = '';
    if (!typed) return;

    if (activeMessageKey) {
        // Append to existing message
        const msg = messages[activeMessageKey];
        if (msg && msg.authorId === myId) {
            const newText = msg.text + typed;
            messagesRef.child(activeMessageKey).update({ text: newText });
        }
        return;
    }

    if (cursorX < 0) return;

    // Check line is still free
    if (isLineOccupiedByOther(cursorY, null)) return;

    // Create new message
    const ref = messagesRef.push({
        text: typed,
        x: cursorX,
        y: cursorY,
        author: myName,
        authorId: myId,
        timestamp: firebase.database.ServerValue.TIMESTAMP
    });

    activeMessageKey = ref.key;
    // Also store locally immediately so render works
    messages[ref.key] = {
        text: typed,
        x: cursorX,
        y: cursorY,
        author: myName,
        authorId: myId
    };
    hideCursor();
    renderMessages();
});

// ===========================================
// RENDER
// ===========================================

function renderMessages() {
    // Remove all message elements
    canvasEl.querySelectorAll('.message').forEach(el => el.remove());

    for (const [key, msg] of Object.entries(messages)) {
        const el = document.createElement('div');
        el.className = 'message';
        el.dataset.key = key;
        el.style.left = msg.x + 'px';
        el.style.top = msg.y + 'px';

        let html = escapeHtml(msg.text);

        // Show cursor inside active message (at end)
        if (key === activeMessageKey) {
            html += '<span style="display:inline-block;width:2px;height:48px;background:#4a9f7e;vertical-align:text-bottom;animation:blink 1s step-end infinite;"></span>';
        }

        if (msg.author) {
            html += '<span class="author-tag">' + escapeHtml(msg.author) + '</span>';
        }

        el.innerHTML = html;
        canvasEl.appendChild(el);
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ===========================================
// FIREBASE LISTENER
// ===========================================

messagesRef.on('child_added', (snapshot) => {
    const key = snapshot.key;
    const val = snapshot.val();
    messages[key] = {
        text: val.text || '',
        x: val.x || 0,
        y: val.y || 0,
        author: val.author || '',
        authorId: val.authorId || '',
        timestamp: val.timestamp || 0
    };
    renderMessages();
});

messagesRef.on('child_changed', (snapshot) => {
    const key = snapshot.key;
    const val = snapshot.val();
    messages[key] = {
        text: val.text || '',
        x: val.x || 0,
        y: val.y || 0,
        author: val.author || '',
        authorId: val.authorId || '',
        timestamp: val.timestamp || 0
    };
    renderMessages();
});

messagesRef.on('child_removed', (snapshot) => {
    delete messages[snapshot.key];
    renderMessages();
});

// ===========================================
// PRESENCE
// ===========================================

const myPresence = usersRef.child(myId);
myPresence.set(myName || 'anonymous');
myPresence.onDisconnect().remove();

usersRef.on('value', (snapshot) => {
    const users = snapshot.val();
    if (users) {
        const names = Object.values(users);
        usersEl.textContent = names.length;
        usersList.innerHTML = names.map(n => `<span>${n}</span>`).join('');
    } else {
        usersEl.textContent = '0';
        usersList.innerHTML = '';
    }
});

hiddenInput.focus();
</script>

</body>
</html>
