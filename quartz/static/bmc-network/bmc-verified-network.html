<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black Mountain College · Verified Connections Network</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'EB Garamond', Georgia, serif;
      background-color: #0a0a0a;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.8rem;
      letter-spacing: 0.3em;
      font-weight: 400;
      margin-bottom: 0.2rem;
    }

    h2 {
      font-size: 0.95rem;
      font-style: italic;
      font-weight: 400;
      color: #888;
    }

    #controls {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.8rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .filter-btn {
      padding: 0.35rem 0.8rem;
      background-color: transparent;
      color: #888;
      border: 1px solid #444;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.08em;
      font-size: 0.7rem;
      transition: all 0.3s ease;
    }

    .filter-btn:hover {
      border-color: #888;
      color: #FFF;
    }

    .filter-btn.active {
      background-color: #FFF;
      color: #0a0a0a;
      border-color: #FFF;
    }

    #connection-type-controls {
      display: flex;
      gap: 0.3rem;
      margin-bottom: 0.8rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .conn-type-btn {
      padding: 0.3rem 0.6rem;
      background-color: transparent;
      border: 1px solid;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.65rem;
      transition: all 0.3s ease;
      opacity: 0.7;
    }

    .conn-type-btn:hover {
      opacity: 1;
    }

    .conn-type-btn.active {
      opacity: 1;
    }

    .conn-type-btn.inactive {
      opacity: 0.3;
    }

    #search-container {
      margin-bottom: 0.8rem;
      position: relative;
    }

    #search-input {
      width: 280px;
      padding: 0.5rem 1rem;
      background: #1a1a1a;
      border: 1px solid #444;
      color: #FFF;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    #search-input:focus {
      border-color: #888;
    }

    #search-input::placeholder {
      color: #666;
    }

    #search-results {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #1a1a1a;
      border: 1px solid #444;
      border-top: none;
      max-height: 300px;
      overflow-y: auto;
      display: none;
      z-index: 100;
    }

    .search-result-item {
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 0.85rem;
      border-bottom: 1px solid #333;
    }

    .search-result-item:hover {
      background: #333;
    }

    .search-result-item .role {
      font-size: 0.7rem;
      color: #888;
    }

    #sliders {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 0.8rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: #888;
    }

    .slider-group input {
      width: 100px;
      cursor: pointer;
    }

    .slider-value {
      min-width: 40px;
      color: #FFF;
    }

    #stats {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 0.5rem;
    }

    #chart-container {
      position: relative;
    }

    canvas {
      display: block;
    }

    #tooltip {
      position: absolute;
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid #444;
      padding: 0.5rem 0.8rem;
      font-size: 0.8rem;
      pointer-events: none;
      display: none;
      max-width: 250px;
      z-index: 10;
    }

    #tooltip .name {
      font-weight: 600;
      margin-bottom: 0.2rem;
    }

    #tooltip .info {
      color: #AAA;
      font-size: 0.75rem;
    }

    #info-panel {
      position: fixed;
      right: 0;
      top: 0;
      width: 320px;
      height: 100vh;
      background: #111;
      border-left: 1px solid #333;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 50;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #info-panel.open {
      transform: translateX(0);
    }

    #info-panel-header {
      padding: 1rem;
      border-bottom: 1px solid #333;
      position: relative;
    }

    #info-panel-header h3 {
      font-size: 1.1rem;
      margin-bottom: 0.3rem;
      padding-right: 30px;
    }

    #info-panel-header p {
      color: #888;
      font-size: 0.8rem;
    }

    #close-panel {
      position: absolute;
      top: 0.8rem;
      right: 0.8rem;
      background: none;
      border: none;
      color: #666;
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }

    #close-panel:hover {
      color: #FFF;
    }

    #info-panel-content {
      flex: 1;
      overflow-y: auto;
    }

    .connection-section {
      border-bottom: 1px solid #333;
    }

    .connection-header {
      padding: 0.7rem 1rem;
      background: #1a1a1a;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .connection-header:hover {
      background: #222;
    }

    .connection-header .label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .connection-header .type-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .connection-header .count {
      background: #333;
      padding: 0.15rem 0.5rem;
      border-radius: 10px;
      font-size: 0.7rem;
    }

    .connection-header .arrow {
      transition: transform 0.2s;
    }

    .connection-section.open .arrow {
      transform: rotate(180deg);
    }

    .connection-list {
      display: none;
      padding: 0.5rem 0;
      background: #111;
    }

    .connection-section.open .connection-list {
      display: block;
    }

    .connection-item {
      padding: 0.4rem 1rem;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .connection-item:hover {
      background: #1a1a1a;
    }

    .connection-item .name {
      color: #DDD;
    }

    .connection-item .context {
      color: #666;
      font-size: 0.7rem;
      font-style: italic;
    }

    #legend {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.7rem;
      color: #666;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    #connection-legend {
      display: flex;
      gap: 0.8rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    footer {
      margin-top: 1rem;
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #333;
    }

    #loading {
      color: #666;
      font-size: 1.2rem;
      margin: 4rem 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>BLACK MOUNTAIN COLLEGE</h1>
    <h2>Verified Connections Network · 1933–1957</h2>
  </header>

  <div id="search-container">
    <input type="text" id="search-input" placeholder="Search by name...">
    <div id="search-results"></div>
  </div>

  <div id="controls">
    <button class="filter-btn active" data-filter="all">ALL</button>
    <button class="filter-btn" data-filter="visual-arts">VISUAL ARTS</button>
    <button class="filter-btn" data-filter="music">MUSIC</button>
    <button class="filter-btn" data-filter="writing">WRITING</button>
    <button class="filter-btn" data-filter="dance">DANCE</button>
    <button class="filter-btn" data-filter="sciences">SCIENCES</button>
    <button class="filter-btn" data-filter="architecture">ARCHITECTURE</button>
    <button class="filter-btn" data-filter="social">SOCIAL SCI.</button>
    <button class="filter-btn" data-filter="faculty">FACULTY ONLY</button>
  </div>

  <div id="connection-type-controls">
    <button class="conn-type-btn active" data-type="teachers" style="border-color: #FF6B6B; color: #FF6B6B;">Teachers/Students</button>
    <button class="conn-type-btn active" data-type="classmates" style="border-color: #4ECDC4; color: #4ECDC4;">Classmates</button>
    <button class="conn-type-btn active" data-type="family" style="border-color: #FFE66D; color: #FFE66D;">Family</button>
    <button class="conn-type-btn active" data-type="productions" style="border-color: #95E1D3; color: #95E1D3;">Productions</button>
    <button class="conn-type-btn active" data-type="governance" style="border-color: #DDA0DD; color: #DDA0DD;">Governance</button>
    <button class="conn-type-btn active" data-type="photos" style="border-color: #FF9F43; color: #FF9F43;">Photos</button>
    <button class="conn-type-btn active" data-type="copresence" style="border-color: #333; color: #666;">Co-presence</button>
  </div>

  <div id="sliders">
    <div class="slider-group">
      <label>Bundle:</label>
      <input type="range" id="tension-slider" min="0" max="100" value="85">
      <span class="slider-value" id="tension-display">0.85</span>
    </div>
  </div>

  <div id="stats">Loading...</div>

  <div id="chart-container">
    <canvas id="chart"></canvas>
    <div id="tooltip"></div>
  </div>

  <div id="info-panel">
    <div id="info-panel-header">
      <button id="close-panel">&times;</button>
      <h3 id="panel-name"></h3>
      <p id="panel-info"></p>
    </div>
    <div id="info-panel-content"></div>
  </div>

  <div id="legend">
    <div class="legend-item"><div class="legend-dot" style="background: #DC143C;"></div>Visual Arts</div>
    <div class="legend-item"><div class="legend-dot" style="background: #DAA520;"></div>Music</div>
    <div class="legend-item"><div class="legend-dot" style="background: #E8E8E8;"></div>Writing</div>
    <div class="legend-item"><div class="legend-dot" style="background: #8B4513;"></div>Dance/Theater</div>
    <div class="legend-item"><div class="legend-dot" style="background: #228B22;"></div>Sciences</div>
    <div class="legend-item"><div class="legend-dot" style="background: #4169E1;"></div>Architecture</div>
    <div class="legend-item"><div class="legend-dot" style="background: #9370DB;"></div>Social Sci.</div>
    <div class="legend-item"><div class="legend-dot" style="background: #666666;"></div>General</div>
  </div>

  <div id="connection-legend">
    <div class="legend-item"><div class="legend-dot" style="background: #FF6B6B;"></div>Teacher/Student</div>
    <div class="legend-item"><div class="legend-dot" style="background: #4ECDC4;"></div>Classmates</div>
    <div class="legend-item"><div class="legend-dot" style="background: #FFE66D;"></div>Family</div>
    <div class="legend-item"><div class="legend-dot" style="background: #95E1D3;"></div>Productions</div>
    <div class="legend-item"><div class="legend-dot" style="background: #DDA0DD;"></div>Governance</div>
    <div class="legend-item"><div class="legend-dot" style="background: #FF9F43;"></div>Photos</div>
    <div class="legend-item"><div class="legend-dot" style="background: #333; border: 1px dashed #555;"></div>Co-presence</div>
  </div>

  <footer>RETCON BLACK MOUNTAIN · 2025</footer>

  <div id="loading">Loading data...</div>

  <script>
    // ============ CONFIG ============
    const width = 950;
    const height = 950;
    const innerRadius = 280;
    const outerRadius = 360;
    const labelRadius = 375;

    const disciplineColors = {
      'visual-arts': '#DC143C',
      'music': '#DAA520',
      'writing': '#E8E8E8',
      'dance': '#8B4513',
      'sciences': '#228B22',
      'architecture': '#4169E1',
      'social': '#9370DB',
      'general': '#666666'
    };

    const connectionColors = {
      'teachers': '#FF6B6B',
      'students': '#FF6B6B',
      'classmates': '#4ECDC4',
      'family': '#FFE66D',
      'productions': '#95E1D3',
      'governance': '#DDA0DD',
      'photos': '#FF9F43'
    };

    const disciplines = ['visual-arts', 'music', 'writing', 'dance', 'sciences', 'architecture', 'social', 'general'];

    const focusToDiscipline = {
      'Art/ Design/ Craft': 'visual-arts',
      'Art/Design/Craft': 'visual-arts',
      'Visual Arts': 'visual-arts',
      'Photography': 'visual-arts',
      'Music': 'music',
      'Writing': 'writing',
      'Literature': 'writing',
      'Languages': 'writing',
      'Dance': 'dance',
      'Theater': 'dance',
      'Dance/ Theater': 'dance',
      'Drama': 'dance',
      'Physical Sciences/ Math': 'sciences',
      'Physical Sciences/Math': 'sciences',
      'Architecture': 'architecture',
      'Social Sciences': 'social',
      'Psychology': 'social',
      'General Studies': 'general',
      '': 'general'
    };

    // ============ STATE ============
    let people = [];
    let allConnections = [];
    let peopleById = {};
    let peopleByName = {};
    let currentFilter = 'all';
    let activeConnectionTypes = new Set(['teachers', 'classmates', 'family', 'productions', 'governance', 'photos', 'copresence']);
    let copresenceConnections = [];
    let hoveredPerson = null;
    let selectedPerson = null;
    let tension = 0.85;

    // ============ LOAD DATA ============
    async function loadData() {
      try {
        const response = await fetch('bmc_people_connections.json');
        if (!response.ok) throw new Error('Failed to load');
        const rawData = await response.json();

        // First pass: create people
        Object.entries(rawData).forEach(([name, data]) => {
          const id = name.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-');
          const discipline = focusToDiscipline[data.focus] || 'general';
          const role = (data.role || '').toLowerCase();

          const person = {
            id,
            name,
            discipline,
            role: data.role || 'Unknown',
            isFaculty: role.includes('faculty'),
            isStudent: role.includes('student'),
            isStaff: role.includes('staff'),
            startYear: data.start_year || 1933,
            endYear: data.end_year || 1957,
            bio: data.bio || '',
            verifiedConnections: data.verified_connections || {}
          };

          people.push(person);
          peopleByName[name] = person;
        });

        // Sort by discipline then start year
        people.sort((a, b) => {
          const dComp = disciplines.indexOf(a.discipline) - disciplines.indexOf(b.discipline);
          if (dComp !== 0) return dComp;
          return a.startYear - b.startYear;
        });

        people.forEach((p, i) => {
          p.index = i;
          peopleById[p.id] = p;
        });

        // Second pass: build connections from verified_connections
        const connectionSet = new Set();

        people.forEach(person => {
          const vc = person.verifiedConnections;

          // Teachers
          (vc.teachers || []).forEach(t => {
            const teacher = peopleByName[t.name];
            if (teacher && teacher.id !== person.id) {
              const key = [person.id, teacher.id].sort().join('|') + '|teachers';
              if (!connectionSet.has(key)) {
                connectionSet.add(key);
                allConnections.push({
                  source: person.id,
                  target: teacher.id,
                  type: 'teachers',
                  context: t.course,
                  term: t.term
                });
              }
            }
          });

          // Family
          (vc.family || []).forEach(f => {
            const relative = peopleByName[f.resolved_name || f.name];
            if (relative && relative.id !== person.id) {
              const key = [person.id, relative.id].sort().join('|') + '|family';
              if (!connectionSet.has(key)) {
                connectionSet.add(key);
                allConnections.push({
                  source: person.id,
                  target: relative.id,
                  type: 'family',
                  context: f.relation
                });
              }
            }
          });

          // Classmates
          (vc.classmates || []).forEach(c => {
            const classmate = peopleByName[c.name];
            if (classmate && classmate.id !== person.id) {
              const key = [person.id, classmate.id].sort().join('|') + '|classmates';
              if (!connectionSet.has(key)) {
                connectionSet.add(key);
                allConnections.push({
                  source: person.id,
                  target: classmate.id,
                  type: 'classmates',
                  context: c.course,
                  term: c.term
                });
              }
            }
          });

          // Productions
          (vc.productions || []).forEach(prod => {
            (prod.co_participants || []).forEach(coName => {
              const coPerson = peopleByName[coName];
              if (coPerson && coPerson.id !== person.id) {
                const key = [person.id, coPerson.id].sort().join('|') + '|productions';
                if (!connectionSet.has(key)) {
                  connectionSet.add(key);
                  allConnections.push({
                    source: person.id,
                    target: coPerson.id,
                    type: 'productions',
                    context: prod.event,
                    year: prod.year
                  });
                }
              }
            });
          });

          // Governance
          (vc.governance || []).forEach(gov => {
            (gov.co_members || []).forEach(coName => {
              const coPerson = peopleByName[coName];
              if (coPerson && coPerson.id !== person.id) {
                const key = [person.id, coPerson.id].sort().join('|') + '|governance';
                if (!connectionSet.has(key)) {
                  connectionSet.add(key);
                  allConnections.push({
                    source: person.id,
                    target: coPerson.id,
                    type: 'governance',
                    context: gov.body
                  });
                }
              }
            });
          });

          // Photos
          (vc.photos || []).forEach(photo => {
            const photoPerson = peopleByName[photo.name];
            if (photoPerson && photoPerson.id !== person.id) {
              const key = [person.id, photoPerson.id].sort().join('|') + '|photos';
              if (!connectionSet.has(key)) {
                connectionSet.add(key);
                const photoInfo = photo.photos && photo.photos[0];
                allConnections.push({
                  source: person.id,
                  target: photoPerson.id,
                  type: 'photos',
                  context: photoInfo ? photoInfo.title : 'Photo together',
                  year: photoInfo ? photoInfo.year : null
                });
              }
            }
          });
        });

        // Build co-presence connections (temporal overlap, not verified)
        const verifiedPairs = new Set();
        allConnections.forEach(c => {
          verifiedPairs.add([c.source, c.target].sort().join('|'));
        });

        // Only create co-presence for pairs that overlap in time and aren't already verified
        for (let i = 0; i < people.length; i++) {
          for (let j = i + 1; j < people.length; j++) {
            const p1 = people[i];
            const p2 = people[j];

            // Check temporal overlap
            const overlapStart = Math.max(p1.startYear, p2.startYear);
            const overlapEnd = Math.min(p1.endYear, p2.endYear);

            if (overlapStart <= overlapEnd) {
              const key = [p1.id, p2.id].sort().join('|');
              if (!verifiedPairs.has(key)) {
                copresenceConnections.push({
                  source: p1.id,
                  target: p2.id,
                  type: 'copresence'
                });
              }
            }
          }
        }

        document.getElementById('loading').style.display = 'none';
        init();
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('loading').textContent = 'Error loading data: ' + error.message;
      }
    }

    // ============ INIT ============
    function init() {
      const canvas = document.getElementById('chart');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      const tooltip = document.getElementById('tooltip');
      const stats = document.getElementById('stats');

      // Calculate positions
      const angleStep = (2 * Math.PI) / people.length;
      people.forEach((p, i) => {
        const angle = i * angleStep - Math.PI / 2;
        p.angle = angle;
        p.x = width / 2 + Math.cos(angle) * outerRadius;
        p.y = height / 2 + Math.sin(angle) * outerRadius;
        p.labelX = width / 2 + Math.cos(angle) * labelRadius;
        p.labelY = height / 2 + Math.sin(angle) * labelRadius;
      });

      function getFilteredData() {
        let filteredPeople = people;
        let filteredConnections = allConnections.filter(c => activeConnectionTypes.has(c.type));

        if (currentFilter !== 'all' && currentFilter !== 'faculty') {
          const relevantPeople = new Set(filteredPeople.filter(p => p.discipline === currentFilter).map(p => p.id));
          filteredConnections = filteredConnections.filter(c => relevantPeople.has(c.source) || relevantPeople.has(c.target));
        }

        if (currentFilter === 'faculty') {
          filteredPeople = filteredPeople.filter(p => p.isFaculty);
          const facultyIds = new Set(filteredPeople.map(p => p.id));
          filteredConnections = filteredConnections.filter(c => facultyIds.has(c.source) && facultyIds.has(c.target));
        }

        return { filteredPeople, filteredConnections };
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);
        const { filteredPeople, filteredConnections } = getFilteredData();
        const activeIds = new Set(filteredPeople.map(p => p.id));

        let connectedIds = new Set();
        const highlightPerson = selectedPerson || hoveredPerson;
        if (highlightPerson) {
          connectedIds.add(highlightPerson.id);
          filteredConnections.forEach(c => {
            if (c.source === highlightPerson.id) connectedIds.add(c.target);
            if (c.target === highlightPerson.id) connectedIds.add(c.source);
          });
        }

        // Count unique connections
        const uniqueConnections = new Set(filteredConnections.map(c => [c.source, c.target].sort().join('|')));
        stats.textContent = `${filteredPeople.length} people · ${uniqueConnections.size.toLocaleString()} verified connections`;

        // Draw co-presence connections first (background layer)
        if (activeConnectionTypes.has('copresence') && !highlightPerson) {
          ctx.strokeStyle = '#222';
          ctx.globalAlpha = 0.08;
          ctx.lineWidth = 0.3;

          copresenceConnections.forEach(conn => {
            const source = peopleById[conn.source];
            const target = peopleById[conn.target];
            if (!source || !target) return;
            if (!activeIds.has(source.id) || !activeIds.has(target.id)) return;

            const cx = width / 2, cy = height / 2;
            const ctrl1x = source.x + (cx - source.x) * tension;
            const ctrl1y = source.y + (cy - source.y) * tension;
            const ctrl2x = target.x + (cx - target.x) * tension;
            const ctrl2y = target.y + (cy - target.y) * tension;

            ctx.beginPath();
            ctx.moveTo(source.x, source.y);
            ctx.bezierCurveTo(ctrl1x, ctrl1y, ctrl2x, ctrl2y, target.x, target.y);
            ctx.stroke();
          });
        }

        // Draw verified connections
        filteredConnections.forEach(conn => {
          const source = peopleById[conn.source];
          const target = peopleById[conn.target];
          if (!source || !target) return;

          const isHighlighted = highlightPerson && (conn.source === highlightPerson.id || conn.target === highlightPerson.id);

          if (highlightPerson) {
            ctx.globalAlpha = isHighlighted ? 0.8 : 0.015;
            ctx.lineWidth = isHighlighted ? 1.8 : 0.5;
          } else {
            ctx.globalAlpha = 0.12;
            ctx.lineWidth = 0.8;
          }

          ctx.strokeStyle = connectionColors[conn.type] || '#666';

          const cx = width / 2, cy = height / 2;
          const ctrl1x = source.x + (cx - source.x) * tension;
          const ctrl1y = source.y + (cy - source.y) * tension;
          const ctrl2x = target.x + (cx - target.x) * tension;
          const ctrl2y = target.y + (cy - target.y) * tension;

          ctx.beginPath();
          ctx.moveTo(source.x, source.y);
          ctx.bezierCurveTo(ctrl1x, ctrl1y, ctrl2x, ctrl2y, target.x, target.y);
          ctx.stroke();
        });

        // Draw discipline arcs
        ctx.globalAlpha = 0.35;
        ctx.lineWidth = 4;
        let currentDiscipline = null;
        let arcStartAngle = 0;

        people.forEach((p, i) => {
          if (p.discipline !== currentDiscipline) {
            if (currentDiscipline !== null && i > 0) {
              ctx.beginPath();
              ctx.arc(width / 2, height / 2, innerRadius - 12, arcStartAngle, people[i - 1].angle + (Math.PI / people.length));
              ctx.strokeStyle = disciplineColors[currentDiscipline];
              ctx.stroke();
            }
            currentDiscipline = p.discipline;
            arcStartAngle = p.angle - (Math.PI / people.length);
          }
        });
        if (currentDiscipline) {
          ctx.beginPath();
          ctx.arc(width / 2, height / 2, innerRadius - 12, arcStartAngle, people[people.length - 1].angle + (Math.PI / people.length));
          ctx.strokeStyle = disciplineColors[currentDiscipline];
          ctx.stroke();
        }

        // Draw dots
        ctx.globalAlpha = 1;
        people.forEach(p => {
          const isConnected = !highlightPerson || connectedIds.has(p.id);
          const isSelected = highlightPerson && highlightPerson.id === p.id;

          ctx.beginPath();
          ctx.arc(p.x, p.y, isSelected ? 6 : 3, 0, 2 * Math.PI);
          ctx.fillStyle = disciplineColors[p.discipline];
          ctx.globalAlpha = highlightPerson ? (isConnected ? 1 : 0.15) : 0.8;
          ctx.fill();
        });

        // Draw labels for selected/hovered person and their connections
        ctx.globalAlpha = 1;
        if (highlightPerson) {
          connectedIds.forEach(id => {
            const p = peopleById[id];
            if (p) drawLabel(ctx, p, p.id === highlightPerson.id);
          });
        }
      }

      function drawLabel(ctx, person, isMain) {
        const angle = person.angle;
        const isRight = angle > -Math.PI / 2 && angle < Math.PI / 2;

        ctx.save();
        ctx.translate(person.labelX, person.labelY);
        ctx.rotate(isRight ? angle : angle + Math.PI);
        ctx.textAlign = isRight ? 'left' : 'right';
        ctx.font = isMain ? 'bold 11px EB Garamond' : '10px EB Garamond';
        ctx.fillStyle = isMain ? '#FFF' : '#AAA';
        ctx.fillText(person.name, isRight ? 5 : -5, 4);
        ctx.restore();
      }

      function findPersonAtPoint(x, y) {
        for (const p of people) {
          const dx = x - p.x;
          const dy = y - p.y;
          if (dx * dx + dy * dy < 100) return p;
        }
        return null;
      }

      // Event handlers
      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (width / rect.width);
        const y = (e.clientY - rect.top) * (height / rect.height);

        const person = findPersonAtPoint(x, y);

        if (person !== hoveredPerson) {
          hoveredPerson = person;
          draw();
        }

        if (person && !selectedPerson) {
          tooltip.style.display = 'block';
          tooltip.style.left = (e.clientX - rect.left + 15) + 'px';
          tooltip.style.top = (e.clientY - rect.top - 10) + 'px';

          const connCount = allConnections.filter(c =>
            (c.source === person.id || c.target === person.id) && activeConnectionTypes.has(c.type)
          ).length;

          tooltip.innerHTML = `
            <div class="name">${person.name}</div>
            <div class="info">${person.role} · ${person.startYear}–${person.endYear}</div>
            <div class="info">${connCount} verified connections</div>
          `;
        } else {
          tooltip.style.display = 'none';
        }
      });

      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (width / rect.width);
        const y = (e.clientY - rect.top) * (height / rect.height);

        const person = findPersonAtPoint(x, y);
        if (person) {
          selectPerson(person);
        }
      });

      canvas.addEventListener('mouseleave', () => {
        hoveredPerson = null;
        tooltip.style.display = 'none';
        draw();
      });

      // Selection and info panel
      function selectPerson(person) {
        selectedPerson = person;
        hoveredPerson = null;
        tooltip.style.display = 'none';
        draw();
        updateInfoPanel(person);
        document.getElementById('info-panel').classList.add('open');
      }

      function updateInfoPanel(person) {
        document.getElementById('panel-name').textContent = person.name;
        document.getElementById('panel-info').textContent = `${person.role} · ${person.startYear}–${person.endYear}`;

        const content = document.getElementById('info-panel-content');
        const vc = person.verifiedConnections;

        // Collect all verified connection names
        const verifiedNames = new Set();
        (vc.teachers || []).forEach(t => verifiedNames.add(t.name));
        (vc.students || []).forEach(s => verifiedNames.add(s.name));
        (vc.classmates || []).forEach(c => verifiedNames.add(c.name));
        (vc.family || []).forEach(f => verifiedNames.add(f.resolved_name || f.name));
        (vc.productions || []).forEach(p => (p.co_participants || []).forEach(n => verifiedNames.add(n)));
        (vc.governance || []).forEach(g => (g.co_members || []).forEach(n => verifiedNames.add(n)));
        (vc.photos || []).forEach(p => verifiedNames.add(p.name));

        // Find unverified connections (temporal overlap only)
        const unverifiedConnections = [];
        people.forEach(other => {
          if (other.name === person.name) return;
          if (verifiedNames.has(other.name)) return;

          // Check temporal overlap
          const overlapStart = Math.max(person.startYear, other.startYear);
          const overlapEnd = Math.min(person.endYear, other.endYear);

          if (overlapStart <= overlapEnd) {
            unverifiedConnections.push({
              name: other.name,
              role: other.role,
              years: `${overlapStart}–${overlapEnd}`,
              overlapYears: overlapEnd - overlapStart + 1
            });
          }
        });

        // Sort by overlap years (descending)
        unverifiedConnections.sort((a, b) => b.overlapYears - a.overlapYears);

        const sections = [
          { key: 'teachers', label: 'Teachers', color: connectionColors.teachers, items: vc.teachers || [] },
          { key: 'students', label: 'Students', color: connectionColors.teachers, items: vc.students || [] },
          { key: 'classmates', label: 'Classmates', color: connectionColors.classmates, items: vc.classmates || [] },
          { key: 'family', label: 'Family', color: connectionColors.family, items: vc.family || [] },
          { key: 'productions', label: 'Productions', color: connectionColors.productions, items: vc.productions || [] },
          { key: 'governance', label: 'Governance', color: connectionColors.governance, items: vc.governance || [] },
          { key: 'photos', label: 'Photos Together', color: connectionColors.photos, items: vc.photos || [] }
        ];

        let html = '';

        sections.forEach(section => {
          if (section.items.length === 0) return;

          html += `
            <div class="connection-section">
              <div class="connection-header" onclick="this.parentElement.classList.toggle('open')">
                <span class="label">
                  <span class="type-dot" style="background: ${section.color}"></span>
                  ${section.label}
                </span>
                <span>
                  <span class="count">${section.items.length}</span>
                  <span class="arrow">▼</span>
                </span>
              </div>
              <div class="connection-list">
          `;

          section.items.forEach(item => {
            if (section.key === 'teachers' || section.key === 'students') {
              const name = item.name;
              const context = `${item.course} · ${item.term}`;
              html += `
                <div class="connection-item" onclick="selectPersonByName('${(name || '').replace(/'/g, "\\'")}')">
                  <div>
                    <div class="name">${name || 'Unknown'}</div>
                    <div class="context">${context || ''}</div>
                  </div>
                </div>
              `;
            } else if (section.key === 'classmates') {
              const name = item.name;
              const context = `${item.course} · ${item.term}`;
              html += `
                <div class="connection-item" onclick="selectPersonByName('${(name || '').replace(/'/g, "\\'")}')">
                  <div>
                    <div class="name">${name || 'Unknown'}</div>
                    <div class="context">${context || ''}</div>
                  </div>
                </div>
              `;
            } else if (section.key === 'family') {
              const name = item.resolved_name || item.name;
              const context = item.relation;
              html += `
                <div class="connection-item" onclick="selectPersonByName('${(name || '').replace(/'/g, "\\'")}')">
                  <div>
                    <div class="name">${name || 'Unknown'}</div>
                    <div class="context">${context || ''}</div>
                  </div>
                </div>
              `;
            } else if (section.key === 'productions') {
              // Show event name as header, then list each co-participant as clickable
              const eventName = item.event;
              const year = item.year ? ` (${item.year})` : '';
              html += `<div class="connection-item" style="cursor: default; background: #1a1a1a;">
                <div class="name" style="color: #95E1D3; font-size: 0.75rem;">${eventName}${year}</div>
              </div>`;
              (item.co_participants || []).forEach(coName => {
                html += `
                  <div class="connection-item" onclick="selectPersonByName('${coName.replace(/'/g, "\\'")}')">
                    <div class="name" style="padding-left: 0.5rem;">↳ ${coName}</div>
                  </div>
                `;
              });
            } else if (section.key === 'governance') {
              // Show body name as header, then list each co-member as clickable
              const bodyName = item.body;
              html += `<div class="connection-item" style="cursor: default; background: #1a1a1a;">
                <div class="name" style="color: #DDA0DD; font-size: 0.75rem;">${bodyName}</div>
              </div>`;
              (item.co_members || []).forEach(coName => {
                html += `
                  <div class="connection-item" onclick="selectPersonByName('${coName.replace(/'/g, "\\'")}')">
                    <div class="name" style="padding-left: 0.5rem;">↳ ${coName}</div>
                  </div>
                `;
              });
            } else if (section.key === 'photos') {
              // Show person name and photo title
              const name = item.name;
              const photoInfo = item.photos && item.photos[0];
              const context = photoInfo ? photoInfo.title : 'Photo together';
              html += `
                <div class="connection-item" onclick="selectPersonByName('${(name || '').replace(/'/g, "\\'")}')">
                  <div>
                    <div class="name">${name || 'Unknown'}</div>
                    <div class="context">${context}</div>
                  </div>
                </div>
              `;
            }
          });

          html += '</div></div>';
        });

        // Add unverified connections section
        if (unverifiedConnections.length > 0) {
          html += `
            <div class="connection-section">
              <div class="connection-header" onclick="this.parentElement.classList.toggle('open')" style="background: #0d0d0d;">
                <span class="label">
                  <span class="type-dot" style="background: #444; border: 1px dashed #666;"></span>
                  Co-presence (unverified)
                </span>
                <span>
                  <span class="count" style="background: #222;">${unverifiedConnections.length}</span>
                  <span class="arrow">▼</span>
                </span>
              </div>
              <div class="connection-list" style="max-height: 300px; overflow-y: auto;">
          `;

          unverifiedConnections.forEach(conn => {
            html += `
              <div class="connection-item" onclick="selectPersonByName('${conn.name.replace(/'/g, "\\'")}')">
                <div>
                  <div class="name" style="color: #888;">${conn.name}</div>
                  <div class="context">${conn.role} · ${conn.years}</div>
                </div>
              </div>
            `;
          });

          html += '</div></div>';
        }

        if (html === '') {
          html = '<p style="padding: 1rem; color: #666;">No connections found.</p>';
        }

        content.innerHTML = html;
      }

      window.selectPersonByName = function(name) {
        const person = peopleByName[name];
        if (person) {
          selectPerson(person);
        }
      };

      // Close panel
      document.getElementById('close-panel').addEventListener('click', () => {
        document.getElementById('info-panel').classList.remove('open');
        selectedPerson = null;
        draw();
      });

      // Filter buttons
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = btn.dataset.filter;
          draw();
        });
      });

      // Connection type buttons
      document.querySelectorAll('.conn-type-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const type = btn.dataset.type;
          if (activeConnectionTypes.has(type)) {
            activeConnectionTypes.delete(type);
            btn.classList.remove('active');
            btn.classList.add('inactive');
          } else {
            activeConnectionTypes.add(type);
            btn.classList.add('active');
            btn.classList.remove('inactive');
          }
          draw();
        });
      });

      // Tension slider
      document.getElementById('tension-slider').addEventListener('input', (e) => {
        tension = e.target.value / 100;
        document.getElementById('tension-display').textContent = tension.toFixed(2);
        draw();
      });

      // Search
      const searchInput = document.getElementById('search-input');
      const searchResults = document.getElementById('search-results');

      searchInput.addEventListener('input', () => {
        const query = searchInput.value.toLowerCase().trim();
        if (query.length < 2) {
          searchResults.style.display = 'none';
          return;
        }

        const matches = people.filter(p => p.name.toLowerCase().includes(query)).slice(0, 10);

        if (matches.length > 0) {
          searchResults.innerHTML = matches.map(p => `
            <div class="search-result-item" data-id="${p.id}">
              <div>${p.name}</div>
              <div class="role">${p.role} · ${p.startYear}–${p.endYear}</div>
            </div>
          `).join('');
          searchResults.style.display = 'block';

          searchResults.querySelectorAll('.search-result-item').forEach(item => {
            item.addEventListener('click', () => {
              const person = peopleById[item.dataset.id];
              if (person) {
                selectPerson(person);
                searchInput.value = '';
                searchResults.style.display = 'none';
              }
            });
          });
        } else {
          searchResults.innerHTML = '<div class="search-result-item">No results</div>';
          searchResults.style.display = 'block';
        }
      });

      searchInput.addEventListener('blur', () => {
        setTimeout(() => searchResults.style.display = 'none', 200);
      });

      // Initial draw
      draw();
    }

    // Start
    loadData();
  </script>
</body>
</html>
